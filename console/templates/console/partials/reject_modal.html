{% load console %}
<div class="modal" id="reject-modal"><div class="box">
  <form method="post" action="{% url 'console:kyc_reject' %}">{% csrf_token %}
    <input type="hidden" name="doc" data-fill="doc"><input type="hidden" name="driver" data-fill="driver"><input type="hidden" name="next" data-fill="next">
    <input type="hidden" name="decision" value="reject">
    <header><h2>Reject <span data-fill="title"></span>?</h2><p>The driver sees your note in the app and can upload it again.</p></header>
    <div class="body">
      <label class="field">What's wrong<select onchange="this.form.note.value=this.value"><option value="">Choose a reason…</option>
        <option>The photo is blurry or cut off — please retake it</option><option>The document has expired</option>
        <option>The name doesn't match your profile</option><option>Wrong document uploaded</option></select></label>
      <label class="field">Note for the driver<textarea name="note" rows="3" required placeholder="e.g. The back side is missing"></textarea></label>
    </div>
    <footer><button type="button" class="btn" data-close>Back</button><button class="btn btn-danger-solid">Reject document</button></footer>
  </form>
</div></div>
