{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="{% block theme %}#001533{% endblock %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{% block title %}Book a vehicle{% endblock %} · MOB</title>
  <link rel="icon" href="{% static 'booking/vehicles/pickup.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'booking/booking.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
{% if customer %}
<nav class="tabbar" id="tabbar">
  <a href="{% url 'booking:home' %}" class="{% if tab == 'book' %}on{% endif %}"><i data-lucide="house"></i>Home</a>
  <a href="{% url 'booking:trips' %}" class="{% if tab == 'trips' %}on{% endif %}"><i data-lucide="package"></i>Bookings</a>
  <a href="{% url 'booking:profile' %}" class="{% if tab == 'profile' %}on{% endif %}"><i data-lucide="circle-user-round"></i>Account</a>
</nav>
{% endif %}
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  window.MOB = {
    csrf: "{{ csrf_token }}", static: "{% static 'booking/' %}", mapKey: "{{ google_maps_key|escapejs }}",
    tiles: { url: "{{ map_tiles.url|escapejs }}", attribution: "{{ map_tiles.attribution|escapejs }}" },
    urls: {
      places: "{% url 'booking:api_places' %}", place: "{% url 'booking:api_place' %}", reverse: "{% url 'booking:api_reverse' %}",
      nearby: "{% url 'booking:api_nearby' %}", options: "{% url 'booking:api_options' %}", book: "{% url 'booking:api_book' %}",
      saved: "{% url 'booking:api_saved' %}", home: "{% url 'booking:home' %}"
    }
  };
</script>
<script src="{% static 'booking/core.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
