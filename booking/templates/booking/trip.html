{% extends "booking/base.html" %}
{% load static %}
{% block title %}Booking {{ t.order_number }}{% endblock %}
{% block head %}<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">{% endblock %}
{% block body %}
<div class="map-app">
  <div id="map"></div>
  <div class="top-float"><a class="round" href="{% url 'booking:trips' %}" aria-label="Back"><i data-lucide="arrow-left"></i></a><span class="grow"></span><span class="pill mono">{{ t.order_number }}</span></div>
  <section class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="status-card"><span class="status-ic" id="st-ic"><i data-lucide="search"></i></span>
      <div class="grow"><h2 id="st-title">…</h2><span class="small muted" id="st-sub"></span></div></div>
    <div class="driver" id="driver" style="margin-top:16px" hidden>
      <span class="avatar" id="d-avatar"></span>
      <div class="grow"><b id="d-name"></b><br><span class="plate" id="d-plate"></span> <span class="small muted" id="d-type"></span></div>
      <a class="call" id="d-call" aria-label="Call driver"><i data-lucide="phone"></i></a>
    </div>
    <h3 style="margin:20px 0 12px">Trip</h3>
    <ul class="timeline" id="steps"></ul>
    <div class="card" style="padding:14px;margin-top:6px">
      <div class="row small"><span class="dot p"></span><span class="grow ellipsis" id="a-pickup"></span></div>
      <div style="height:10px"></div>
      <div class="row small"><span class="dot d"></span><span class="grow ellipsis" id="a-drop"></span></div>
    </div>
    <h3 style="margin:20px 0 6px">Fare</h3>
    <div id="fare"></div>
    <div id="photos" hidden><h3 style="margin:20px 0 10px">Proof of delivery</h3><div class="row" id="photo-list" style="flex-wrap:wrap"></div></div>
    <div style="margin-top:20px" id="cancel-box" hidden><button class="btn btn-danger" id="cancel">Cancel booking</button></div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var url = "{% url 'booking:api_trip' t.pk %}", cancelUrl = "{% url 'booking:api_cancel' t.pk %}";
  var s = {{ state_json|safe }}, map, driverMarker, fitted = false;
  map = L.map("map", { zoomControl: false }).setView([s.pickup.lat, s.pickup.lng], 14);
  map.attributionControl.setPosition("topright");
  L.tileLayer(MOB_MAP.url, { maxZoom: 19, attribution: MOB_MAP.attribution }).addTo(map);
  function pin(c, size) { size = size || 22; return L.divIcon({ className: "", iconSize: [size, size], iconAnchor: [size / 2, size / 2], html: '<span style="display:block;width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + c + ';border:4px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3)"></span>' }); }
  var car = L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: [17, 17], html: '<span style="display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#1463ff;border:3px solid #fff;box-shadow:0 4px 14px rgba(20,99,255,.5)"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11v6a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/></svg></span>' });
  if (s.route.length) L.polyline(s.route, { color: "#1463ff", weight: 5, opacity: .85 }).addTo(map);
  L.marker([s.pickup.lat, s.pickup.lng], { icon: pin("#0e9f6e") }).addTo(map);
  L.marker([s.drop.lat, s.drop.lng], { icon: pin("#d64534") }).addTo(map);

  var copy = {
    requested: ["search", "Finding your driver", "Hang tight — we're matching you with the nearest driver."],
    no_driver_available: ["clock", "Still looking for a driver", "All drivers nearby are busy. We'll keep trying — or cancel and book again."],
    assigned: ["navigation", "Driver is on the way", "Heading to your pickup."],
    arrived_at_pickup: ["map-pin", "Driver has arrived", "They're at the pickup — hand over your goods."],
    in_progress: ["truck", "On the way to the drop", "Your goods are moving."],
    completed: ["circle-check-big", "Delivered", "Your goods have reached the drop."],
    cancelled: ["circle-x", "Booking cancelled", ""]
  };
  function time(iso) { return iso ? new Date(iso).toLocaleString([], { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : ""; }
  function km(a, b) { var R = 6371, dLat = (b[0] - a[0]) * Math.PI / 180, dLng = (b[1] - a[1]) * Math.PI / 180; var x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }

  function render(d) {
    s = d;
    var c = copy[d.status] || ["package", d.status_label, ""];
    $("st-ic").innerHTML = '<i data-lucide="' + c[0] + '"></i>';
    $("st-ic").style.background = d.status === "completed" ? "#e3f6ee" : d.status === "cancelled" ? "#fdecea" : "#ebf2ff";
    $("st-ic").style.color = d.status === "completed" ? "#0e9f6e" : d.status === "cancelled" ? "#d64534" : "#1463ff";
    $("st-title").textContent = c[1];
    var sub = c[2];
    if (d.driver && d.driver.lat && (d.status === "assigned")) {
      var dist = km([d.driver.lat, d.driver.lng], [d.pickup.lat, d.pickup.lng]);
      sub = "About " + Math.max(2, Math.round(dist / 22 * 60) + 1) + " min away · " + dist.toFixed(1) + " km";
    }
    if (d.cancelled) sub = (d.cancelled.by === "customer" ? "You cancelled" : "Cancelled") + (d.cancelled.reason ? " · " + d.cancelled.reason : "");
    $("st-sub").textContent = sub;

    $("driver").hidden = !d.driver;
    if (d.driver) {
      $("d-name").textContent = d.driver.name;
      $("d-plate").textContent = d.driver.vehicle || "—";
      $("d-type").textContent = d.vehicle_type;
      $("d-avatar").innerHTML = d.driver.photo ? '<img src="' + d.driver.photo + '" alt="">' : (d.driver.name || "D").trim().split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join("");
      $("d-call").hidden = !d.driver.phone; if (d.driver.phone) $("d-call").href = "tel:" + d.driver.phone;
      if (d.driver.lat) {
        var ll = [d.driver.lat, d.driver.lng];
        if (!driverMarker) driverMarker = L.marker(ll, { icon: car }).addTo(map); else driverMarker.setLatLng(ll);
      } else if (driverMarker) { map.removeLayer(driverMarker); driverMarker = null; }
    }
    var current = d.steps.findIndex(function (x) { return !x.at; });
    $("steps").innerHTML = d.steps.map(function (x, i) {
      var cls = x.at ? "done" : (i === current && d.status !== "cancelled" ? "now" : "");
      return '<li class="' + cls + '"><i></i>' + x.label + "<small>" + (x.at ? time(x.at) : i === current && d.status !== "cancelled" ? "In progress" : "") + "</small></li>";
    }).join("");
    $("a-pickup").textContent = d.pickup.address; $("a-drop").textContent = d.drop.address + (d.drop.name ? " · " + d.drop.name : "");
    var b = d.breakdown;
    $("fare").innerHTML =
      '<div class="price-line"><span class="muted">Base fare</span><span>₹' + b.base.toFixed(2) + "</span></div>" +
      '<div class="price-line"><span class="muted">Distance' + (d.distance_m ? " (" + (d.distance_m / 1000).toFixed(1) + " km)" : "") + '</span><span>₹' + b.distance.toFixed(2) + "</span></div>" +
      '<div class="price-line"><span class="muted">Time</span><span>₹' + b.time.toFixed(2) + "</span></div>" +
      '<div class="price-line total"><span>' + (d.paid ? "Paid" : "To pay the driver") + '</span><span>₹' + d.fare.toFixed(2) + "</span></div>" +
      '<p class="small muted" style="margin:6px 0 0">' + (d.paid ? "Payment received — thank you." : "Pay by cash or UPI when your goods are delivered.") + "</p>";
    $("photos").hidden = !d.photos.length;
    $("photo-list").innerHTML = d.photos.map(function (u) { return '<a href="' + u + '" target="_blank" rel="noopener"><img src="' + u + '" style="width:120px;height:120px;object-fit:cover;border-radius:14px;border:1px solid #e6ebf1" alt="proof"></a>'; }).join("");
    $("cancel-box").hidden = !d.can_cancel;
    if (!fitted) {
      var pts = [[d.pickup.lat, d.pickup.lng], [d.drop.lat, d.drop.lng]].concat(d.route);
      map.fitBounds(pts, window.innerWidth >= 900 ? { paddingTopLeft: [480, 60], paddingBottomRight: [60, 60] } : { paddingTopLeft: [40, 90], paddingBottomRight: [40, window.innerHeight * .55] });
      fitted = true;
    }
    mobIcons();
  }
  render(s);
  var live = setInterval(function () {
    if (s.status === "completed" || s.status === "cancelled") { clearInterval(live); return; }
    mobApi(url).then(render).catch(function () {});
  }, 5000);
  $("cancel").addEventListener("click", function () {
    var reason = window.prompt("Why are you cancelling? (optional)", "Changed my plans");
    if (reason === null) return;
    this.disabled = true;
    mobApi(cancelUrl, { reason: reason }).then(function (d) { render(d); mobToast("Booking cancelled."); })
      .catch(function (e) { mobToast(e.message); $("cancel").disabled = false; });
  });
})();
</script>
{% endblock %}
