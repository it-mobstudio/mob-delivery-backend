services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mob_delivery
      POSTGRES_USER: mob
      POSTGRES_PASSWORD: mob
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mob -d mob_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
