services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mob_delivery
      POSTGRES_USER: mob
      POSTGRES_PASSWORD: mob
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mob -d mob_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted routing engine — trips.routing calls its /route endpoint for
  # distance/duration/polyline. On first start it downloads the OSM extract
  # named by `tile_urls` and builds tiles into the valhalla-data volume,
  # which can take several minutes; subsequent starts reuse the built tiles.
  #
  # Defaults to BBBike's pre-cut Bengaluru extract, which is enough for
  # intra-city delivery. If trips need to route beyond city limits, swap
  # `tile_urls` for a Karnataka/India extract from https://download.geofabrik.de/asia/india.html
  # (bigger PBF, longer tile build, wider coverage) — verify whichever URL
  # you use is still live before deploying, extract URLs do move.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "8002:8002"
    volumes:
      - valhalla-data:/custom_files
    environment:
      tile_urls: https://download.bbbike.org/osm/bbbike/Bangalore/Bangalore.osm.pbf
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      force_rebuild: "False"

  # Trip lifecycle event bus (trips.events.publish_trip_event) — single-node
  # KRaft mode, no Zookeeper needed. Only required when KAFKA_ENABLED=True;
  # the app degrades to a no-op publisher otherwise (see trips/events.py).
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

volumes:
  pgdata:
  valhalla-data:
