<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 44px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
      background: #0f2942; color: #fff; font: 500 13px/1 Inter, system-ui, sans-serif;
    }
    .topbar b { font-weight: 700; letter-spacing: .2px; }
    .topbar a { color: #cfe3f5; text-decoration: none; margin-left: 20px; cursor: pointer; }
    .topbar a:hover { color: #fff; text-decoration: underline; }
    #redoc { padding-top: 44px; }
    @media (max-width: 600px) { .topbar span { display: none; } }
  </style>
</head>
<body>
  <div class="topbar">
    <b>{{ title }} <span style="font-weight:400;opacity:.7">- Reference</span></b>
    <nav><a id="download">Download OpenAPI (JSON)</a></nav>
  </div>
  <div id="redoc"></div>
  {{ spec|json_script:"openapi-spec" }}
  {% if redoc_js %}<script>{{ redoc_js|safe }}</script>{% else %}<script src="{{ redoc_cdn }}"></script>{% endif %}
  <script>
    var spec = JSON.parse(document.getElementById("openapi-spec").textContent);
    Redoc.init(spec, {
      scrollYOffset: 44,
      expandResponses: "200,201",
      requiredPropsFirst: true,
      sortPropsAlphabetically: false,
      pathInMiddlePanel: true,
      jsonSampleExpandLevel: 3,
      menuToggle: true,
      theme: {
        colors: { primary: { main: "#0f6cbd" } },
        typography: {
          fontSize: "15px",
          fontFamily: "Inter, system-ui, -apple-system, Segoe UI, sans-serif",
          headings: { fontFamily: "Inter, system-ui, sans-serif", fontWeight: "700" },
          code: { fontFamily: "'JetBrains Mono', ui-monospace, Menlo, monospace", fontSize: "13px" }
        },
        sidebar: { width: "300px", backgroundColor: "#f7f9fc" },
        rightPanel: { backgroundColor: "#0f2942" }
      }
    }, document.getElementById("redoc"));
    document.getElementById("download").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(spec, null, 2)], { type: "application/json" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "openapi.json";
      link.click();
    });
  </script>
</body>
</html>
