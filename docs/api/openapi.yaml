  /driver/trips/{id}/complete:
    post:
      operationId: driverComplete
      description: |-
        Finishes the trip (`in_progress` -> `completed`), records `completed_at`, and **credits the driver's wallet** with their share of the fare in the same step.

        **Prepaid** trip: send an empty body. **Cash on delivery**: the fare must have been paid (see *Driver payments*) and `otp` - the 6-digit code texted to the customer
        - is **required**; it proves the customer received the goods. If the order asked for item verification, every item must be answered first.

        The checks run in this order, so the first that fails is the one you see: `ITEMS_NOT_VERIFIED` -> `PAYMENT_NOT_COLLECTED` -> `INVALID_DELIVERY_OTP` -> status.

        **Who may call this:** **Driver** - a driver token only.
      summary: Hand over and complete the delivery
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: The trip's id (UUID) - from `GET /driver/trips/active` or the
          trip list.
        required: true
      tags:
      - Driver trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCompleteRequest'
            examples:
              CashOnDeliveryTheCustomerSCode:
                value:
                  otp: '387406'
                summary: 'Cash on delivery: the customer''s code'
              PrepaidNoBodyNeeded:
                value: {}
                summary: 'Prepaid: no body needed'
      security:
      - DriverToken: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALIDDELIVERYOTP:
                  value:
                    success: false
                    error:
                      code: INVALID_DELIVERY_OTP
                      message: The delivery OTP is invalid or has expired.
                  summary: INVALID_DELIVERY_OTP
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: |-
            One of:
            - `INVALID_DELIVERY_OTP` - The delivery OTP the driver entered is wrong or has expired (valid for 5 minutes).
            - `INVALID` - The request body, query string or form is missing a required field or has a value that isn't acceptable. `details` names every offending field.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTAUTHENTICATED:
                  value:
                    success: false
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                  summary: NOT_AUTHENTICATED
                TOKENNOTVALID:
                  value:
                    success: false
                    error:
                      code: TOKEN_NOT_VALID
                      message: Given token not valid for any token type
                  summary: TOKEN_NOT_VALID
          description: |-
            One of:
            - `NOT_AUTHENTICATED` - No `Authorization` header was sent.
            - `TOKEN_NOT_VALID` - The bearer token is expired, malformed, or was signed by another environment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTYOURTRIP:
                  value:
                    success: false
                    error:
                      code: NOT_YOUR_TRIP
                      message: This trip is not assigned to you.
                  summary: NOT_YOUR_TRIP
                PERMISSIONDENIED:
                  value:
                    success: false
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                  summary: PERMISSION_DENIED
          description: |-
            One of:
            - `NOT_YOUR_TRIP` - A driver called a trip endpoint for a trip that isn't assigned to them.
            - `PERMISSION_DENIED` - You are signed in, but this kind of token may not use this endpoint (e.g. a driver token on a company endpoint, or the reverse).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTFOUND:
                  value:
