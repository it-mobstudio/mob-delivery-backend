        * `already_paid` - already_paid
        * `underpaid` - underpaid
        * `trip_not_in_progress` - trip_not_in_progress
        * `unknown_qr` - unknown_qr
        * `ignored` - ignored
    BlankEnum:
      enum:
      - ''
      type: string
      description: 'An empty value: not applicable.'
