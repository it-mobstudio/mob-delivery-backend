servers:
- url: /api/v1
  description: Server
tags:
- name: Introduction
  description: |-
    ## What this API does

    The MOB Delivery API lets a company **book deliveries and follow them to the door**, and powers the **driver app** that carries them out.

    You describe a delivery - a pickup, a drop, what you are sending, how it is paid - and the platform prices it, finds the nearest available driver, and
    guides that driver through pickup, delivery, **cash collection by Razorpay QR** and a customer OTP hand-over. You can read the state of every delivery at any time,
    including who delivered which item and a photo of it.

    ## Who is this documentation for?

    | You are... | You use | Start with |
    |---|---|---|
    | **A developer integrating a company's systems** (order management, e-commerce, ERP) | The **Company API** with an *API client* token | *Authentication*, then *Booking a delivery* |
    | **Building the company's admin panel** | The **Company API** with an *admin* token - plus driver management and KYC review | *Authentication*, then *Driver onboarding & wallet* |
    | **Building or maintaining the driver mobile app** | The **Driver app API** with a *driver* token | *Driver app walkthrough* |

    ## How the docs are organised

    The documentation is split into five groups (the left-hand menu in the reference view, the sections in Swagger UI):

    - **Start here** - this page, how to sign in, the conventions every endpoint follows, and the complete list of error codes.
    - **Guides** - the ideas that span several endpoints: the trip lifecycle, end-to-end walkthroughs, payments, items and invoices, onboarding and the wallet.
    - **Company API** - every endpoint for companies, grouped by topic.
    - **Driver app API** - every endpoint the driver app calls.
    - **Webhooks** - what Razorpay calls on our side.

    Every endpoint page tells you **who may call it, which fields are required and which are optional, what comes back, and every error it can return** - with real example
    payloads and copy-paste **cURL, Python and JavaScript** samples. Fields marked *required* must be sent; everything else can be left out.

    ## The base URL

    All endpoints live under one versioned prefix:

    ```
    {your-server}/api/v1
    ```

    For example `POST {your-server}/api/v1/trips`. The paths in this documentation are shown **relative to that prefix** (`/trips`), and the server picker
    in the interactive console fills the prefix in for you. In the code samples, `BASE_URL` means `{your-server}/api/v1`.

    ```bash
    export BASE_URL="https://your-server.example.com/api/v1"
    ```

    ## Try it in five calls

    This is the shortest path from nothing to a booked delivery. Each step is explained in *Booking a delivery*.

    ```bash
    # 1. Sign in (server-to-server) - you get a token valid for 60 minutes
    curl -X POST "$BASE_URL/auth/client-token" -H "Content-Type: application/json" \
      -d '{"client_id": "<your client id>", "client_secret": "<your client secret>"}'
    export ACCESS_TOKEN="<the access value from the response>"

    # 2. Price the delivery for every vehicle type you offer
    curl -X POST "$BASE_URL/trips/estimate" -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
      -d '{"pickup": {"address": "MG Road Metro, Bengaluru", "lat": "12.975000", "lng": "77.605000"},
           "drop":   {"address": "12 Indiranagar 100ft Road, Bengaluru", "lat": "12.978300", "lng": "77.640800"}}'

    # 3. Book it with the vehicle type the customer picked
    curl -X POST "$BASE_URL/trips" -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
      -d '{"vehicle_type_id": "<id from step 2>", "payment_mode": "prepaid",
           "pickup": {"address": "MG Road Metro, Bengaluru", "lat": "12.975000", "lng": "77.605000"},
           "drop":   {"address": "12 Indiranagar 100ft Road, Bengaluru", "lat": "12.978300", "lng": "77.640800"}}'

    # 4. Follow it (look at "status")
    curl "$BASE_URL/trips/<id from step 3>" -H "Authorization: Bearer $ACCESS_TOKEN"

    # 5. Cancel it, if you must (until the driver has started the delivery)
    curl -X POST "$BASE_URL/trips/<id>/cancel" -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
      -d '{"reason": "Customer cancelled the order"}'
    ```

    ## Two ways to explore

    - **Swagger UI** (`/api/docs/`) - an interactive console. Click **Authorize**, paste a token, and press **Try it out** on any endpoint to make real calls.
    - **This reference** (`/api/redoc/`) - the same content laid out for reading, with the menu and the request/response examples side by side.
    - **The OpenAPI file** (`/api/schema/`) - the machine-readable description, to generate a client library or import into Postman/Insomnia.

    ## Good to know before you start

    - **Everything is scoped to one company.** A token belongs to a company and only ever sees that company's data. Asking for another company's trip is a plain `404`.
    - **There are no push notifications or webhooks to your systems yet.** To follow a delivery, poll `GET /trips/{id}` (every 5-15 seconds is plenty).
      The only webhook in this API is the one Razorpay calls on us (see *Payments (Razorpay)*).
    - **Booking has no idempotency key.** If a booking request times out, list your trips before retrying so you don't book the delivery twice.
  x-traitTag: true
- name: Authentication
  description: |-
    ## Overview

    Every endpoint except sign-in itself needs a **bearer token**:

    ```
    Authorization: Bearer <token>
    ```

    There are **three kinds of token** - one for each kind of caller (a *principal*). Each token is tied to one company, and the server decides what you may do from the
    kind of token you present.

    | Principal | Who it is | How to get a token | Lifetime | Renew with |
    |---|---|---|---|---|
    | **API client** | A company's **backend** (server-to-server integration) | `POST /auth/client-token` with a client id + secret | 60 minutes | Request a new one - **no refresh token** |
    | **Admin** | A person using the company's **admin panel** | `POST /auth/login` with email + password | access 60 min, refresh 7 days | `POST /auth/refresh` |
    | **Driver** | A person using the **driver app** | `POST /driver/auth/otp/request`, then `.../otp/verify` (SMS code) | access 60 min, refresh 30 days | `POST /driver/auth/refresh` |

    In this documentation the three bearer schemes are named **ApiClientToken**, **AdminToken** and **DriverToken**. In Swagger UI, click **Authorize** and paste the token into the matching box
    (they are all "Bearer" tokens - only the source differs).

    ## Who can call what

    | Area | API client | Admin | Driver |
    |---|:-:|:-:|:-:|
    | Trips - estimate, book, list, read, assign, cancel | yes | yes | no |
    | Vehicle types, vehicles, vehicle documents | yes | yes | no |
    | Uploads (`POST /uploads`) | yes | yes | no |
    | **Drivers** - roster, KYC review, **driver wallets** | **no** | yes | no |
    | **Driver app** endpoints (`/driver/...`) | no | no | yes |

    Calling an endpoint with the wrong kind of token returns **`403 PERMISSION_DENIED`** (not 401): you are signed in, just not as the right principal. Every operation in this reference
    states **"Who may call this"**.

    ## For a server-to-server integration (API client)

    ```bash
    curl -X POST "$BASE_URL/auth/client-token" \
      -H "Content-Type: application/json" \
      -d '{"client_id": "0b1c3a52-6f0e-4d3e-9a55-1f2b7c9d4e10", "client_secret": "sk_live_..."}'
    ```

    ```json
    { "access": "eyJhbGciOiJIUzI1NiIs...", "expires_in": 3600 }
    ```

    - Keep the **client secret on your server**. Never put it in a web page or mobile app. It is shown once when the client is created; if it is lost, have a new client created.
    - Cache the token and reuse it until it is about to expire (`expires_in` seconds). When any call returns **`401 TOKEN_NOT_VALID`**, fetch a new token and retry once.
    - API clients are created by the platform operator for your company; ask them for your client id and secret.

    ## For the admin panel

    `POST /auth/login` with `email` and `password` returns an `access` and a `refresh` token. Use `access` on every call; before it expires (or when you get `401 TOKEN_NOT_VALID`) trade the
    `refresh` token at `POST /auth/refresh` for a new `access` token. When the refresh token itself expires, the person signs in again.

    ## For the driver app

    Drivers have no passwords. They sign in with their **phone number and an SMS code**:

    1. `POST /driver/auth/otp/request` with the phone number - the driver gets a 6-digit code (valid 5 minutes).
    2. `POST /driver/auth/otp/verify` with the phone and the code - you get an `accessToken`, a `refreshToken` and the driver's profile.
    3. Send `Authorization: Bearer <accessToken>` on every driver call.
    4. Before the access token expires, `POST /driver/auth/refresh` returns a **new pair** - store both tokens again. A driver stays signed in for up to 30 days without another SMS.
    5. `POST /driver/auth/logout` revokes the refresh token.

    The full flow is in *Driver app walkthrough*.

    ## Things that trip people up

    - **Sign-in endpoints ignore any `Authorization` header**, so a stale token left in your HTTP client's default headers can't stop you getting a new one.
    - **`401` vs `403`.** `401` means *we don't accept your token* (missing, expired, malformed - `NOT_AUTHENTICATED` or `TOKEN_NOT_VALID`): get a new token. `403` means *your token is fine but is the
      wrong kind, or the action isn't yours* (`PERMISSION_DENIED`, `NOT_YOUR_TRIP`): a new token won't help.
    - **An account that gets disabled stops working immediately**, even with an unexpired token: the token is re-checked against the account on every request.
    - **Tokens are not interchangeable across environments.** A token from staging is `TOKEN_NOT_VALID` in production.
  x-traitTag: true
- name: Conventions
  description: |-
    ## Requests and responses

    - **JSON everywhere.** Send `Content-Type: application/json` and read JSON back. The exceptions are the **file-upload** endpoints (`POST /uploads`, the driver's document/photo uploads and item verification), which take
      `multipart/form-data`.
    - **HTTPS only in production.** Tokens travel in a header; never send them over plain HTTP.
    - **Field names are `snake_case`.** (One exception: the driver sign-in responses use `camelCase` - `accessToken`, `refreshToken` - because the driver app was built against that shape.)
    - **Unknown fields in a request are ignored**, not rejected. Fields marked *required* must be present; everything else may be omitted.

    ## Status codes

    | Code | Meaning |
    |---|---|
    | `200` | OK - the body is the result. |
    | `201` | Created - the body is the new resource. |
    | `204` | Done - there is no body (deletes). |
    | `400` | The request was malformed or a field is invalid (`INVALID`, `PARSE_ERROR`, or a specific code). Nothing was changed. |
    | `401` | No or unacceptable token. |
    | `403` | Signed in, but not allowed. |
    | `404` | Not found - or belongs to another company. |
    | `409` | The request is well-formed but conflicts with the current state (wrong trip status, already paid, ...). |
    | `422` | The request is understood but can't be priced/processed (e.g. `FARE_NOT_CONFIGURED`). |
    | `429` | Too soon - wait and retry (delivery OTP resend). |
    | `502` / `503` | An upstream service (routing engine, payment provider) is failing. Retry shortly. |

    Errors always use the same envelope - see *Errors*.

    ## Identifiers

    Every resource has a **UUID** id (`"5920b157-27b4-43c2-a3a9-8d9fd7f0e3db"`). Treat it as an opaque string. Your own order number goes in a trip's `reference_id`.

    ## Dates and times

    - **Timestamps** are ISO 8601 in **UTC** with a trailing `Z` and microsecond precision: `"2026-09-21T09:41:05.554924Z"`. Parse them as instants; convert to local time for display.
    - **Dates** (a licence expiry, a date of birth) are `YYYY-MM-DD`.
    - Where a request needs the caller's local day boundary (the driver's "today"), it takes `utc_offset_minutes` - minutes **east** of UTC (India: `330`).

    ## Money

    - The currency is **INR** (`"currency": "INR"`) everywhere.
    - On **records** (a trip's fares, a wallet entry) amounts are **decimal strings** with two places: `"85.00"`. Parse them as decimals, not floats.
    - In **calculated answers** (`POST /trips/estimate`, the payment QR's `amount`, a payout's balance summary) amounts are JSON **numbers**: `85.0`. Each field's page says which.
    - Razorpay itself works in **paise** (1/100 rupee); the API converts for you. You only meet paise in the raw Razorpay webhook body.

    ## Coordinates

    `lat` is -90 to 90 and `lng` is -180 to 180, in decimal degrees, with **up to 6 decimal places**. In JSON you may send them as numbers or as strings; they come back as strings
    (`"12.975000"`). Route polylines are encoded at **6 decimal places** (`polyline_precision: 6`), not the 5 used by Google - pass that precision to your decoder or the route will be drawn in the wrong place.

    ## Phone numbers

    International format with the country code: `+919876543210`. The API accepts 10-15 digits with an optional leading `+`, and stores what you send - so send the same form every time
    (a driver signs in with the exact number the company registered).

    ## Pagination

    Lists are paginated, **20 per page** by default, newest first.

    | Query parameter | Meaning |
    |---|---|
    | `page` | Page number, starting at 1. |
    | `page_size` | Items per page: default 20, **maximum 100**. |

    ```json
    {
      "count": 137,
      "next": "https://your-server/api/v1/trips?page=2",
      "previous": null,
      "results": [ ... ]
    }
    ```

    `count` is the total across all pages. Follow `next` until it is `null`.

    ## Filtering

    Where an endpoint supports filters they are plain query parameters listed on its page (`GET /trips?status=assigned&driver=<id>`). Several filters combine with AND.
    Comma-separated values (`status=completed,cancelled`) are supported only where the endpoint says so.

    ## Files and media URLs

    - Upload a file with `POST /uploads` (multipart) and pass the **URL it returns** to whatever field wants a file (`invoice_url`, `photo_url`, `file_url`, ...).
    - URLs the API returns for stored files are **absolute** (`https://...`) so they open in a browser or the driver's phone as they are. Don't build file URLs yourself.
    - Only `http(s)` links are accepted in URL fields.
    - Uploads are checked by content, not just the file name, and limited to 10 MB.

    ## Multi-tenancy

    Every token belongs to exactly one company. You can only read and change that company's data, and never need to send a company id. A resource of another company is indistinguishable from one that
    doesn't exist: `404 NOT_FOUND`.

    ## Rate limits and retries

    The API applies no global rate limit, but a few calls are deliberately throttled (the delivery OTP can be re-sent once per 30 seconds per trip). Be considerate: poll a trip every 5-15 seconds, not in a tight loop.
    A request that fails with `502`/`503` should have had no lasting effect - it is safe to retry it. A request that **times out** may or may not have been processed: for creations (booking), look before you retry.
  x-traitTag: true
- name: Errors
  description: |-
    ## The error envelope

    Every error - from a validation failure to a business rule - has the same shape:

    ```json
    {
      "success": false,
      "error": {
        "code": "TRIP_NOT_CANCELLABLE",
        "message": "A trip in status 'in_progress' cannot be cancelled."
      }
    }
    ```

    | Field | Meaning |
    |---|---|
    | `success` | Always `false` for an error. (Successful responses don't have this wrapper: the body **is** the resource.) |
    | `error.code` | A **stable, machine-readable** code. **Branch on this.** |
    | `error.message` | A sentence for people. Safe to show a user, but it may be reworded - **never match on it.** |
    | `error.details` | Only for `INVALID`: an object naming every bad field, `{"field": ["problem", ...]}`. |

    ## Validation errors: `INVALID`

    When a request has bad or missing fields you get **HTTP 400** with code `INVALID` and a `details` object listing **every** problem at once, so you can fix them in one go. Nothing is changed.

    ```json
    {
      "success": false,
      "error": {
        "code": "INVALID",
        "message": "Request could not be processed.",
        "details": {
          "pickup": ["This field is required."],
          "drop": {"contact_phone": ["Required for a COD trip - the finalizing OTP is sent to this number."]}
        }
      }
    }
    ```

    Nested objects appear under their own field name; list items are keyed by position.

    ## Handling errors well

    1. **Look at the HTTP status first** - it tells you the *class* of problem (fix the request, get a new token, retry later).
    2. **Then `error.code`** - it tells you exactly which rule. Show the `message` to people, but decide behaviour from the `code`.
    3. **`5xx` and `429` are retryable** with a pause. `4xx` are not - repeating the same request gives the same error. The exception is `401 TOKEN_NOT_VALID`: get a new token, then retry once.
    4. **`409` means "the world is not in the state this call needs"** - fetch the resource and look at its current status before deciding what to do.

    ## Every error code

    The table below is generated from the same catalogue the endpoint pages use, so it is always complete. Each endpoint page lists the codes that **it** can return.

    ### General

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `INVALID` | 400 | The request body, query string or form is missing a required field or has a value that isn't acceptable. `details` names every offending field. | Read `error.details` (`{field: [problems]}`), fix each field and resend. Nothing was changed. |
    | `PARSE_ERROR` | 400 | The body could not be parsed - usually malformed JSON, or a `Content-Type` that doesn't match the body. | Send valid JSON with `Content-Type: application/json` (or `multipart/form-data` on the upload endpoints). |
    | `UNSUPPORTED_MEDIA_TYPE` | 415 | The endpoint doesn't accept the `Content-Type` you sent (e.g. JSON sent to a file-upload endpoint). | Use the content type shown on the endpoint's request body (`multipart/form-data` for uploads). |
    | `NOT_FOUND` | 404 | No such resource - or it belongs to another company. The API never confirms that other companies' data exists. | Check the id. If it came from this API it may have been deleted, or the token belongs to a different company. |
    | `METHOD_NOT_ALLOWED` | 405 | The path exists but not for that HTTP method. | Use the method shown in this documentation. |

    ### Authentication & access

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `NOT_AUTHENTICATED` | 401 | No `Authorization` header was sent. | Send `Authorization: Bearer <access token>`. See the Authentication guide. |
    | `TOKEN_NOT_VALID` | 401 | The bearer token is expired, malformed, or was signed by another environment. | Get a new token (API clients: `POST /auth/client-token`; admins and drivers: use the refresh endpoint). |
    | `AUTHENTICATION_FAILED` | 401 | Wrong credentials (client id/secret, email/password), or the account behind a valid token is inactive. | Check the credentials. For an API client, confirm it is still active in the admin panel. |
    | `PERMISSION_DENIED` | 403 | You are signed in, but this kind of token may not use this endpoint (e.g. a driver token on a company endpoint, or the reverse). | Use the right principal for the endpoint - each operation lists who may call it. |
    | `NOT_YOUR_TRIP` | 403 | A driver called a trip endpoint for a trip that isn't assigned to them. | Only act on trips returned by `GET /driver/trips/active` or `GET /driver/trips`. |
    | `INVALID_REFRESH_TOKEN` | 401 | The driver's refresh token has expired or was already used up. | Send the driver through the OTP login again. |
    | `INVALID_OTP` | 400 | The login OTP is wrong or has expired (OTPs last 5 minutes). | Ask for a new OTP with `POST /driver/auth/otp/request`. |
    | `DRIVER_NOT_FOUND` | 404 | Sign-up is closed on this server and no driver is registered with this phone number. (When sign-up is open, an unknown number simply becomes a new driver.) | Ask the company to register the driver (`POST /drivers`), or check the number (`+919000000001`). |
    | `DRIVER_PHONE_AMBIGUOUS` | 409 | The same phone number belongs to drivers in more than one company, so the login can't tell which one to use. | Contact support - phone numbers must be unique across companies. |
    | `ACCOUNT_DISABLED` | 403 | The company has disabled this driver. | Nothing to retry - the company has to re-enable the driver. |
    | `ACCOUNT_LOCKED` | 403 | The driver's account is locked because their driving licence has expired. | The driver has to submit a valid licence, then the company re-verifies it. |

    ### Trips

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `VEHICLE_TYPE_NOT_FOUND` | 404 | `vehicle_type_id` doesn't match an active vehicle type of your company. | List your vehicle types with `GET /vehicle-types` and use one of those ids. |
    | `FARE_NOT_CONFIGURED` | 422 | The vehicle type has no fare card, so a price can't be calculated. | Configure the fare fields on the vehicle type (`base_fare`, `per_km_rate`, ...). |
    | `ROUTING_UNAVAILABLE` | 503 | The routing engine couldn't route between the pickup and the drop (out of coverage, or the engine is down). | Check the coordinates are inside the served area; otherwise retry shortly. |
    | `TRIP_NOT_RETRYABLE` | 409 | You tried to (re)assign a trip that isn't in `no_driver_available`. | Only trips with status `no_driver_available` can be assigned again. |
    | `TRIP_NOT_CANCELLABLE` | 409 | The trip is past the point where it can be cancelled (in progress, completed, or already cancelled). | Trips can be cancelled up to `arrived_at_pickup`. Fetch the trip to see its current status. |
    | `INVALID_TRIP_STATUS_TRANSITION` | 409 | The driver action isn't valid for the trip's current status (e.g. `start` before `arrive`). | Fetch the trip and follow the lifecycle: arrive -> start -> (pay) -> complete. |
    | `TRIP_NOT_ACTIVE` | 409 | Navigation was requested for a trip that has nothing left to navigate to (completed or cancelled). | Stop asking for navigation once the trip is finished. |
    | `DRIVER_HAS_ACTIVE_TRIP` | 409 | The driver can't do this (go off duty, change vehicle, delete the account, be disabled) while a trip is active. | Complete or cancel the active trip first. |
    | `INVALID_DELIVERY_OTP` | 400 | The delivery OTP the driver entered is wrong or has expired (valid for 5 minutes). | Re-enter it, or resend it with `POST /driver/trips/{id}/delivery-otp/resend`. |
    | `OTP_ALREADY_REQUESTED` | 429 | A delivery OTP was sent for this trip less than 30 seconds ago. | Wait for the cool-down (30 s) and try again. |

    ### Payments

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `NOT_COD_TRIP` | 409 | A payment step was used on a prepaid trip. Prepaid trips take no payment at the drop. | Skip payment for `payment_mode = prepaid` and complete the trip directly. |
    | `TRIP_NOT_IN_PROGRESS` | 409 | The payment code is only available once the delivery has started (`in_progress`). | Call `start` first. |
    | `ALREADY_PAID` | 409 | The trip's fare has already been paid (the customer scanned an earlier code, or it was collected already). | Nothing to collect - go on to the delivery OTP and `complete`. |
    | `PAYMENT_NOT_RECEIVED` | 409 | The driver asked the server to confirm the payment, and the payment provider has no payment for this trip's code yet (or it was for less than the fare). | Not a fault: ask the customer to scan and pay, then check again in a moment. |
    | `PAYMENT_NOT_COLLECTED` | 409 | `complete` was called on a COD trip before its payment was confirmed. | Show the payment code and wait for the payment before completing. |
    | `PAYMENT_PROVIDER_ERROR` | 502 | The payment provider (Razorpay) refused a request or sent an answer that couldn't be read. The message says why. | Retry once; if it persists, contact the platform operator with the message. |
    | `PAYMENT_PROVIDER_UNAVAILABLE` | 503 | The payment provider couldn't be reached or is failing. | Retry in a moment. Nothing was charged and the trip is unchanged. |
    | `PAYMENT_PROVIDER_NOT_CONFIGURED` | 503 | This server has no (valid) payment-provider keys - or the keys are valid but Razorpay's QR Codes product isn't activated on the account (Razorpay answers "The requested URL was not found" for that). | Operator action: set the Razorpay keys, and if they are set, ask Razorpay support to activate QR Codes on the account (see the Payments guide). |

    ### Items & invoices

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `ITEMS_NOT_VERIFIED` | 409 | The order asked for its items to be verified (`verify_items: true`) and some are still unanswered. Payment and completion are blocked until every item is marked delivered / not delivered. | Have the driver answer each item (`POST /driver/trips/{id}/items/{item_id}/verify`), then retry. |
    | `ITEM_NOT_FOUND` | 404 | `item_id` isn't an item of this trip. | Use the ids in the trip's `items` array. |
    | `VERIFICATION_NOT_REQUESTED` | 409 | The driver tried to verify items on an order created without `verify_items`. | Only orders created with `verify_items: true` have a verification step. |

    ### Driver duty & vehicles

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `DRIVER_NOT_ELIGIBLE` | 403 | The driver can't go on duty: KYC isn't fully verified or the account isn't active. | Finish onboarding and wait for the company's approval (see `onboarding_status` on `GET /driver/me`). |
    | `VEHICLE_CATEGORY_NOT_ALLOWED` | 403 | The driver's verified licence doesn't cover this vehicle's category. | Choose a vehicle from `GET /driver/vehicles` (it lists only what the driver may take). |
    | `VEHICLE_IN_USE` | 409 | Another driver is on duty with this vehicle. | Pick another vehicle. |
    | `VEHICLE_NOT_ACTIVE` | 409 | The vehicle has been disabled by the company. | Pick another vehicle. |

    ### Driver onboarding

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `PROFILE_LOCKED` | 409 | Name and date of birth can't change once the driver's ID has been verified. | Ask the company's support to correct it. |
    | `KYC_ALREADY_VERIFIED` | 409 | The driver tried to re-submit a document the company already verified. | Nothing to do; contact support if it must change. |

    ### Uploads & webhooks

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `INVALID_UPLOAD` | 400 | The file isn't an acceptable image/PDF (wrong type, too large, or corrupt). | Send a JPEG/PNG/WebP (or a PDF where documents allow it) within the size limit. |
    | `INVALID_SIGNATURE` | 400 | The webhook's `X-Razorpay-Signature` doesn't match the body - it wasn't sent by Razorpay (or the secret is wrong). | Only Razorpay should call this endpoint. Check `RAZORPAY_WEBHOOK_SECRET` matches the secret in the Razorpay dashboard. |
    | `INVALID_PAYLOAD` | 400 | The webhook body isn't a JSON object. | Razorpay always sends JSON; this only happens with hand-made requests. |
    | `WEBHOOK_NOT_CONFIGURED` | 503 | The server has no webhook secret, so it can't tell real Razorpay calls from fake ones and refuses all of them. | Operator action: set `RAZORPAY_WEBHOOK_SECRET`. |

    ### Wallet & payouts

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `INVALID_AMOUNT` | 400 | A wallet entry's amount is zero, or isn't positive for a payout, bonus or penalty (the server applies the sign for those kinds). | Send a positive amount for `payout`, `bonus` and `penalty`. Only `adjustment` may be negative, and none may be zero. |
    | `INVALID_KIND` | 400 | A trip-earning entry was posted by hand. Earnings are credited automatically when a trip completes. (The request schema doesn't allow `trip_earning`, so an ordinary client gets `INVALID` first.) | Post only `payout`, `bonus`, `penalty` or `adjustment`. |
    | `INSUFFICIENT_BALANCE` | 409 | The payout is more than what the company currently owes the driver. | Read `GET /drivers/{id}/wallet` and pay out at most the `balance`. |
    | `WALLET_BALANCE_PENDING` | 409 | The driver tried to delete their account while the company still owes them money. | The company pays the balance out first, then the driver can delete the account. |

    ### Fleet

    | Code | HTTP | When it happens | What to do |
    |---|---|---|---|
    | `VEHICLE_HAS_ACTIVE_TRIP` | 409 | The vehicle can't be disabled while a trip is using it. | Wait until the trip is finished, then disable it. |
    | `VEHICLE_TYPE_IN_USE` | 409 | The vehicle type can't be deleted while vehicles still use it. | Re-assign or remove those vehicles first (or mark the type inactive instead of deleting). |
  x-traitTag: true
- name: Trip lifecycle
  description: |-
    ## The states of a trip

    A trip moves through a fixed set of states. Its `status` field always says where it is.

    ```
                                              cancel (company or driver)
                              ┌──────────────────────────────────────────────┐
                              │                                              ▼
     POST /trips ──▶ requested ──▶ assigned ──▶ arrived_at_pickup ──▶ in_progress ──▶ completed
                         │  matching   ▲   driver:       driver:          driver:
                         ▼             │   arrive         start           complete
                no_driver_available ───┘
                         (POST /trips/{id}/assign to retry)

                         cancelled  ◀── from requested, no_driver_available, assigned, arrived_at_pickup
    ```

    | Status | What it means | What moves it on | Can be cancelled? |
    |---|---|---|---|
    | `requested` | Just created; the server is looking for a driver. You will rarely see it - booking assigns in the same call. | the server | yes |
    | `no_driver_available` | Nobody eligible was within reach. The trip exists and can be retried. | you: `POST /trips/{id}/assign` | yes |
    | `assigned` | A driver has the trip and is heading to the pickup. | the driver: **arrive** | yes |
    | `arrived_at_pickup` | The driver is at the pickup, collecting the goods. | the driver: **start** | yes |
    | `in_progress` | The goods are on the way to the drop. | the driver: **complete** (after payment/verification) | **no** |
    | `completed` | Delivered. The driver has been credited. | - (final) | no |
    | `cancelled` | Cancelled by the company, the driver, or the system. See `cancelled_by` and `cancellation_reason`. | - (final) | no |

    A trip can be cancelled **until the driver starts the delivery**. Once it is `in_progress` the only way out is `completed`.

    ## What happens at each step

    **1. You book** (`POST /trips`). The route is calculated and the **fare is fixed** - it will not change later. The server immediately tries to assign the **nearest available driver**. A driver qualifies when they are:

    - online (on duty),
    - verified (Aadhaar, licence and police all `verified`, licence unexpired, account active),
    - on a vehicle of the **vehicle type you booked**, with that vehicle active,
    - not already on another trip, and
    - within **8 km** of the pickup (using the position from their last GPS ping).

    If one qualifies the trip is `assigned` in the same response; if none does it is `no_driver_available` (still a `201`).

    **2. The driver reaches the pickup** (`arrive` -> `arrived_at_pickup`, `arrived_at_pickup_at` set).

    **3. The driver picks up and sets off** (`start` -> `in_progress`, `started_at` set). Cancellation is no longer possible.

    **4. At the drop**, depending on how the order was booked:

    - If `verify_items` is on: the driver checks **every item** (delivered / not delivered, optionally with a photo). Nothing below can happen until they have all been answered.
    - **Cash on delivery** (`payment_mode: cod`): the driver shows a **Razorpay QR** for the exact fare; the customer pays; the server marks the trip **paid** and texts the customer a **6-digit delivery OTP**. See *Payments (Razorpay)*.
    - **Prepaid** (`payment_mode: prepaid`): already paid - there is nothing to collect.

    **5. The driver completes** (`complete` -> `completed`, `completed_at` set). For cash on delivery they enter the customer's OTP - proof the goods were handed over. In the same step the **driver's wallet is credited**
    with their share of the fare (80% by default).

    ## Following a trip

    There are no webhooks to your systems yet, so **poll `GET /trips/{id}`** every 5-15 seconds and act on `status`:

    ```text
    assigned            -> show "driver on the way" (driver.full_name, driver.phone_number, vehicle.registration_number)
    arrived_at_pickup   -> "driver has arrived at the pickup"
    in_progress         -> "out for delivery"
    completed           -> done: read completed_at, payment_reference, and items[].status / proof_image_url
    cancelled           -> read cancelled_by and cancellation_reason
    no_driver_available -> offer to retry (POST /trips/{id}/assign) or cancel
    ```

    The timestamps `assigned_at`, `arrived_at_pickup_at`, `started_at` and `completed_at` (and `cancelled_at`) tell you when each stage happened; they are `null` until it does.

    ## Payment state runs alongside

    `payment_status` is independent of `status`:

    | `payment_mode` | Starts as | Becomes `paid` when |
    |---|---|---|
    | `prepaid` | `paid` | (already) - the money was settled outside this system |
    | `cod` | `pending` | the customer's **Razorpay** payment is confirmed (`cod_collected_at` and `payment_reference` are then set) |

    A cash-on-delivery trip **cannot be completed while `payment_status` is `pending`**.

    ## Cancelling

    | Who | How | Until |
    |---|---|---|
    | The company | `POST /trips/{id}/cancel` with a `reason` | `arrived_at_pickup` |
    | The driver | `POST /driver/trips/{id}/cancel` with a `reason` | `arrived_at_pickup` |

    A cancelled trip is final. If the **driver** cancelled, the trip is *not* re-offered to another driver automatically - book a new trip.

    A cash-on-delivery payment code is only issued once a trip is `in_progress`, which can no longer be cancelled, so a customer can't pay for a cancelled trip through the normal flow. If money ever does arrive for a
    trip that is no longer in progress, the server does **not** mark it paid, records it in its log, and a person has to **refund it from the Razorpay dashboard**.

    ## Status quick reference for the driver app

    | The driver sees... | when `status` is... |
    |---|---|
    | "Head to pickup" | `assigned` |
    | "Collecting the goods" | `arrived_at_pickup` |
    | "Head to drop" / "Collect payment" / "Enter OTP" | `in_progress` (which one depends on items, `payment_status` and the OTP) |
    | "Delivery completed" | `completed` |
  x-traitTag: true
- name: Booking a delivery
  description: |-
    ## What you will build

    An end-to-end integration for a company's backend: authenticate, price a delivery, book it (with an invoice and an item list the driver must verify, paid on delivery), follow it, and read the result.
    Every step shows the real request and a trimmed real response. Set these once:

    ```bash
    export BASE_URL="https://your-server.example.com/api/v1"
    ```

    ## 1. Get a token

    ```bash
    curl -X POST "$BASE_URL/auth/client-token" -H "Content-Type: application/json" \
      -d '{"client_id": "0b1c3a52-6f0e-4d3e-9a55-1f2b7c9d4e10", "client_secret": "<secret>"}'
    ```
    ```json
    { "access": "eyJhbGciOiJIUzI1NiIs...", "expires_in": 3600 }
    ```
    ```bash
    export ACCESS_TOKEN="eyJhbGciOiJIUzI1NiIs..."
    ```

    Cache it for `expires_in` seconds. On a `401 TOKEN_NOT_VALID` fetch a new one and retry. (*Authentication* has the details.)

    ## 2. See what you can offer (optional)

    ```bash
    curl "$BASE_URL/vehicle-types" -H "Authorization: Bearer $ACCESS_TOKEN"
    ```

    The vehicle types are yours (Bike, Tempo, ...). Each has a **fare card**. A type with `min_fare` of `0` isn't priced yet and can't be booked.

    ## 3. Price the delivery

    ```bash
    curl -X POST "$BASE_URL/trips/estimate" -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" -d '{
      "pickup": {"address": "MG Road Metro Station, Bengaluru", "lat": "12.975000", "lng": "77.605000"},
      "drop":   {"address": "12 Indiranagar 100ft Road, Bengaluru", "lat": "12.978300", "lng": "77.640800"}
    }'
    ```
    ```json
    { "estimates": [
      { "vehicle_type_id": "725d6bae-1bdc-4a7a-ad03-8ef8ae0c6f13", "vehicle_type_name": "Bike", "category": "two_wheeler",
        "distance_meters": 4200, "duration_seconds": 780, "base_fare": 30.0, "distance_fare": 42.0, "time_fare": 13.0,
        "surge_multiplier": 1.0, "total_fare": 85.0, "currency": "INR", "polyline_precision": 6, "route_polyline": "ox|vWogs_sC..." },
      { "vehicle_type_id": "48def33b-8d32-4f13-9a73-fda7482a5d3a", "vehicle_type_name": "Tempo", "total_fare": 129.9, "...": "..." }
    ] }
    ```

    Show these as choices. Nothing is stored. The `vehicle_type_id` the customer picks goes into the booking.

    ## 4. Upload the invoice (optional)

    If you have the invoice as a file, upload it to get a URL (or skip this and pass a link you host yourself):

    ```bash
    curl -X POST "$BASE_URL/uploads" -H "Authorization: Bearer $ACCESS_TOKEN" \
      -F "purpose=trip_invoice" -F "file=@/path/to/INV-1001.pdf"
    ```
    ```json
    { "url": "https://your-server.example.com/media/3b79.../trip-invoices/525c9e10-....pdf" }
    ```

    ## 5. Book it

    A **cash-on-delivery** order with an invoice and two items the driver must verify:

    ```bash
    curl -X POST "$BASE_URL/trips" -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" -d '{
      "vehicle_type_id": "725d6bae-1bdc-4a7a-ad03-8ef8ae0c6f13",
      "payment_mode": "cod",
      "reference_id": "ORD-20260921-0042",
      "pickup": {"address": "MG Road Metro Station, Bengaluru", "lat": "12.975000", "lng": "77.605000",
                 "contact_name": "Acme Hardware", "contact_phone": "+919888800001"},
      "drop":   {"address": "12 Indiranagar 100ft Road, Bengaluru", "lat": "12.978300", "lng": "77.640800",
                 "contact_name": "Asha Menon", "contact_phone": "+919888800002"},
      "invoice_url": "https://your-server.example.com/media/3b79.../trip-invoices/525c9e10-....pdf",
      "invoice_number": "INV-1001",
      "verify_items": true,
      "items": [
        {"name": "Cement bag 50 kg", "quantity": 4, "unit": "bags", "sku": "CEM-50", "unit_price": "380.00", "notes": "Keep dry"},
        {"name": "TMT bar 12 mm",    "quantity": 20, "unit": "pcs",  "sku": "TMT-12", "unit_price": "95.00"}
      ]
    }'
    ```

    **Required:** `vehicle_type_id`, `payment_mode`, `pickup` and `drop` (each with `address`, `lat`, `lng`). **Also required here:** the drop's `contact_phone`, because a cash-on-delivery trip texts the delivery OTP to it.
    Everything else - `reference_id`, `invoice_*`, `verify_items`, `items` - is optional (`verify_items` needs at least one item).

    ```json
    {
      "id": "5920b157-27b4-43c2-a3a9-8d9fd7f0e3db",
      "status": "assigned",
      "reference_id": "ORD-20260921-0042",
      "driver": { "id": "bd316e30-...", "full_name": "Ravi Kumar", "phone_number": "+919876543210" },
      "vehicle": { "id": "34dbaab9-...", "registration_number": "KA01AB1234" },
      "total_fare": "85.00", "currency": "INR",
      "payment_mode": "cod", "payment_status": "pending",
      "verify_items": true,
      "items": [ { "id": "d3035b1c-...", "name": "Cement bag 50 kg", "quantity": 4, "status": "pending", "proof_image_url": null }, "..." ],
      "assigned_at": "2026-09-21T09:41:05.554924Z"
    }
    ```

    **Check `status`.** `assigned` means a driver has it. `no_driver_available` means nobody qualified right now - see step 7. Save the `id`.

    ## 6. Follow it

    ```bash
    curl "$BASE_URL/trips/5920b157-27b4-43c2-a3a9-8d9fd7f0e3db" -H "Authorization: Bearer $ACCESS_TOKEN"
    ```

    Poll every 5-15 seconds and switch on `status` (see *Trip lifecycle*): `assigned` -> `arrived_at_pickup` -> `in_progress` -> `completed`. For a customer-facing tracker show `driver.full_name`,
    `driver.phone_number` and `vehicle.registration_number` once `assigned`.

    To list many at once: `GET /trips?status=in_progress&page_size=50`.

    ## 7. If no driver was found

    `status: "no_driver_available"`. Wait a moment (a driver may come online) and retry:

    ```bash
    curl -X POST "$BASE_URL/trips/5920b157-27b4-43c2-a3a9-8d9fd7f0e3db/assign" -H "Authorization: Bearer $ACCESS_TOKEN"
    ```

    The answer is the trip again - `assigned` or still `no_driver_available`. Not finding anyone is not an error. Give up with a cancel when you've waited long enough.

    ## 8. Cancel

    ```bash
    curl -X POST "$BASE_URL/trips/5920b157-27b4-43c2-a3a9-8d9fd7f0e3db/cancel" -H "Authorization: Bearer $ACCESS_TOKEN" \
      -H "Content-Type: application/json" -d '{"reason": "Customer cancelled the order"}'
    ```

    Allowed until the driver starts the delivery; after that you get `409 TRIP_NOT_CANCELLABLE`.

    ## 9. Read the outcome

    When `status` is `completed`, `GET /trips/{id}` gives you everything to close the order in your system:

    - `completed_at`, `payment_status: "paid"`, `cod_collected_at` and **`payment_reference`** (Razorpay's `pay_...` id, to reconcile against your Razorpay dashboard).
    - For each `items[]`: `status` (`delivered` / `not_delivered`), `verified_at`, `proof_image_url` (the driver's photo) and `driver_note` - your delivery history.

    ## Handling failures

    | You get | Meaning | Do |
    |---|---|---|
    | `400 INVALID` | A field is missing or wrong; `error.details` names each. | Fix the fields, resend. |
    | `404 VEHICLE_TYPE_NOT_FOUND` | The vehicle type isn't an active one of yours. | List `GET /vehicle-types`. |
    | `422 FARE_NOT_CONFIGURED` | The vehicle type has no fare card. | Set its `min_fare` above 0. |
    | `503 ROUTING_UNAVAILABLE` | The route couldn't be computed. | Check coordinates; retry shortly. |
    | `401 TOKEN_NOT_VALID` | Token expired. | Get a new one, retry once. |
    | *timeout* on booking | It may have been booked. | `GET /trips` and look for your `reference_id` among the newest trips before retrying. |

    The full list is in *Errors*.
  x-traitTag: true
- name: Driver app walkthrough
  description: |-
    ## A driver's day, in API calls

    This is the exact sequence the driver app follows. Set these once (the driver's token comes from step 1):

    ```bash
    export BASE_URL="https://your-server.example.com/api/v1"
    export DRIVER_TOKEN="<accessToken from step 1>"
    ```

    ## 1. Sign in with a phone number

    ```bash
    curl -X POST "$BASE_URL/driver/auth/otp/request" -H "Content-Type: application/json" -d '{"phone_number": "+919000000001"}'
    ```
    ```json
    { "message": "OTP sent to +919000000001." }
    ```

    (A non-production server also returns `"otp": "482913"` so you can test without an SMS gateway.) Then verify the code the driver received:

    ```bash
    curl -X POST "$BASE_URL/driver/auth/otp/verify" -H "Content-Type: application/json" -d '{"phone_number": "+919000000001", "otp": "482913"}'
    ```
    ```json
    {
      "accessToken": "eyJhbGciOi...", "tokenType": "Bearer", "expiresInSeconds": 3600,
      "refreshToken": "eyJhbGciOi...", "refreshExpiresInSeconds": 2592000,
      "driverName": "Ravi Kumar",
      "driver": { "id": "...", "onboarding_status": "approved", "is_online": false, "...": "..." }
    }
    ```

    Store both tokens. **A phone number nobody has registered becomes a brand-new empty driver** (when the server allows self sign-up) - `driver.onboarding_status` will be `profile_incomplete`. Renew before expiry with
    `POST /driver/auth/refresh` (send `{"refreshToken": "..."}`, get a **new pair** back - save both).

    ## 2. Decide the first screen from `onboarding_status`

    `GET /driver/me` returns the same profile at any time. Key the app's first screen on `onboarding_status`:

    | `onboarding_status` | Show |
    |---|---|
    | `profile_incomplete`, `documents_required` | The onboarding flow (step 3) |
    | `under_review` | "Your documents are with the company" - wait, poll `GET /driver/me` |
    | `action_required` | What was rejected (`kyc.aadhar.rejection_note`, ...) and let them re-submit |
    | `approved` | The dashboard (step 4) |

    ## 3. Onboarding (new drivers)

    Each step saves on its own, so a driver can leave and come back.

    ```bash
    # About me - every field optional; send what you have
    curl -X PATCH "$BASE_URL/driver/me" -H "Authorization: Bearer $DRIVER_TOKEN" -H "Content-Type: application/json" \
      -d '{"full_name": "Ravi Kumar", "date_of_birth": "1994-03-12", "city": "Bengaluru", "pincode": "560001",
           "emergency_contact_name": "Sunita Kumar", "emergency_contact_phone": "+919555500002"}'

    # A selfie (multipart)
    curl -X POST "$BASE_URL/driver/me/photo" -H "Authorization: Bearer $DRIVER_TOKEN" -F "photo=@selfie.jpg"

    # Aadhaar: the number and both sides (multipart)
    curl -X POST "$BASE_URL/driver/me/kyc/aadhar" -H "Authorization: Bearer $DRIVER_TOKEN" \
      -F "number=234567890123" -F "front=@aadhaar_front.jpg" -F "back=@aadhaar_back.jpg"

    # Driving licence: number, expiry, front (back optional)
    curl -X POST "$BASE_URL/driver/me/kyc/dl" -H "Authorization: Bearer $DRIVER_TOKEN" \
      -F "number=KA0120200012345" -F "expiry_date=2031-06-30" -F "front=@licence_front.jpg"

    # Police verification certificate (optional to upload)
    curl -X POST "$BASE_URL/driver/me/kyc/police" -H "Authorization: Bearer $DRIVER_TOKEN" -F "document=@police.pdf"

    # Where to send payouts (UPI or bank)
    curl -X PATCH "$BASE_URL/driver/me" -H "Authorization: Bearer $DRIVER_TOKEN" -H "Content-Type: application/json" -d '{"payout_upi_id": "ravi@okhdfc"}'
    ```

    Each upload answers with the refreshed profile. When the driver has completed the profile and provided Aadhaar and licence, `onboarding_status` becomes `under_review`. The **company verifies** the documents
    (`PATCH /drivers/{id}/kyc/aadhar`, `/police` and `/dl`, with an admin token) - after which the driver is `approved` and can take trips. If the company rejects a document, `onboarding_status` becomes `action_required` with a `rejection_note`, and the driver re-submits.
    More in *Driver onboarding & wallet*.

    ## 4. Go on duty

    ```bash
    # Which vehicles may I take? (only ones my verified licence covers, that nobody else is using)
    curl "$BASE_URL/driver/vehicles" -H "Authorization: Bearer $DRIVER_TOKEN"

    # Go online on one, with my current GPS fix so I can be matched straight away
    curl -X POST "$BASE_URL/driver/duty/start" -H "Authorization: Bearer $DRIVER_TOKEN" -H "Content-Type: application/json" \
      -d '{"vehicle_id": "34dbaab9-e77f-466a-93f3-3637131968ea", "lat": "12.971600", "lng": "77.594600"}'
    ```

    From now on, send the position **every 15-30 seconds** while on duty:

    ```bash
    curl -X POST "$BASE_URL/driver/location" -H "Authorization: Bearer $DRIVER_TOKEN" -H "Content-Type: application/json" -d '{"lat": "12.971900", "lng": "77.595100"}'
    ```

    Trips are matched only to drivers whose last position is **within 8 km of the pickup**.

    ## 5. Wait for a trip

    There are no push notifications yet, so **poll** every few seconds while idle:

    ```bash
    curl "$BASE_URL/driver/trips/active" -H "Authorization: Bearer $DRIVER_TOKEN"
    ```
    ```json
    { "trip": null }
    ```

    When a trip is assigned the body carries the whole trip (`{"trip": {"id": "...", "status": "assigned", ...}}`): addresses, contacts, route, fare, `driver_earning`, invoice and item checklist. Use its `id` below.

    ## 6. Run the delivery

    ```bash
    TRIP=5920b157-27b4-43c2-a3a9-8d9fd7f0e3db

    # The road to the pickup, from where I am now (draw the polyline at 6 decimal places)
    curl "$BASE_URL/driver/trips/$TRIP/navigation?lat=12.9719&lng=77.5951" -H "Authorization: Bearer $DRIVER_TOKEN"

    # I'm at the pickup
    curl -X POST "$BASE_URL/driver/trips/$TRIP/arrive" -H "Authorization: Bearer $DRIVER_TOKEN"

    # I have the goods - go (the trip can no longer be cancelled)
    curl -X POST "$BASE_URL/driver/trips/$TRIP/start" -H "Authorization: Bearer $DRIVER_TOKEN"
    ```

    Each answers with the updated trip. To give up before starting: `POST /driver/trips/$TRIP/cancel` with `{"reason": "..."}`.

    ## 7. At the drop

    **If the order has `verify_items: true`**, first answer for every item (multipart; a camera photo is optional):

    ```bash
    curl -X POST "$BASE_URL/driver/trips/$TRIP/items/$ITEM/verify" -H "Authorization: Bearer $DRIVER_TOKEN" \
      -F "status=delivered" -F "photo=@proof.jpg"
    # not delivered needs a note
    curl -X POST "$BASE_URL/driver/trips/$TRIP/items/$OTHER_ITEM/verify" -H "Authorization: Bearer $DRIVER_TOKEN" \
      -F "status=not_delivered" -F "note=Damaged in transit"
    ```

    **If the order is cash on delivery**, collect the money through Razorpay:

    ```bash
    # Show this QR (image_url) to the customer - it is for exactly this trip's fare
    curl "$BASE_URL/driver/trips/$TRIP/payment/qr" -H "Authorization: Bearer $DRIVER_TOKEN"
    ```
    ```json
    { "provider": "razorpay", "reference": "qr_Nx4a1Kp0aB9cXz", "image_url": "https://rzp.io/i/Nx4a1Kp",
      "amount": 85.0, "currency": "INR", "expires_at": "2026-09-21T10:15:00Z", "qr_payload": null }
    ```

    The customer scans and pays. Razorpay tells the server, which marks the trip **paid** and texts the customer a 6-digit delivery OTP - so the app just **waits** (re-read `GET /driver/trips/$TRIP` and watch `payment_status`).
    "Check payment" asks the server to look right now:

    ```bash
    curl -X POST "$BASE_URL/driver/trips/$TRIP/payment/collect" -H "Authorization: Bearer $DRIVER_TOKEN"
    # 409 PAYMENT_NOT_RECEIVED  -> not paid yet, wait and check again
    # 200 {"message": "Payment collected. An OTP was sent to +919888800002 ..."}
    ```

    If the customer says the SMS didn't arrive: `POST /driver/trips/$TRIP/delivery-otp/resend` (once per 30 seconds).

    ## 8. Hand over

    ```bash
    # Cash on delivery: the customer tells you the OTP they were texted
    curl -X POST "$BASE_URL/driver/trips/$TRIP/complete" -H "Authorization: Bearer $DRIVER_TOKEN" -H "Content-Type: application/json" -d '{"otp": "387406"}'
    # Prepaid: no body
    curl -X POST "$BASE_URL/driver/trips/$TRIP/complete" -H "Authorization: Bearer $DRIVER_TOKEN"
    ```

    The trip becomes `completed` and the driver's wallet is credited. `driver_earning` on the trip says how much.

    ## 9. Earnings

    ```bash
    curl "$BASE_URL/driver/wallet?utc_offset_minutes=330" -H "Authorization: Bearer $DRIVER_TOKEN"          # balance, today/week/month, last 7 days
    curl "$BASE_URL/driver/wallet/transactions" -H "Authorization: Bearer $DRIVER_TOKEN"                    # the statement
    curl "$BASE_URL/driver/stats?utc_offset_minutes=330" -H "Authorization: Bearer $DRIVER_TOKEN"           # today / all-time counts
    curl "$BASE_URL/driver/trips?status=completed,cancelled" -H "Authorization: Bearer $DRIVER_TOKEN"       # history
    ```

    ## 10. End of shift

    ```bash
    curl -X POST "$BASE_URL/driver/duty/end" -H "Authorization: Bearer $DRIVER_TOKEN"      # refused while a trip is active
    curl -X POST "$BASE_URL/driver/auth/logout" -H "Content-Type: application/json" -d '{"refreshToken": "..."}'
    ```

    ## Errors the app should handle

    | Code | Show / do |
    |---|---|
    | `TOKEN_NOT_VALID` (401) | Refresh the session; if that fails, back to sign-in. |
    | `INVALID_OTP` | "That code is wrong or expired" - offer to resend. |
    | `DRIVER_NOT_ELIGIBLE`, `VEHICLE_CATEGORY_NOT_ALLOWED` | Explain what is missing from the driver's verification. |
    | `ITEMS_NOT_VERIFIED` | Take the driver to the item checklist. |
    | `PAYMENT_NOT_RECEIVED` | Not an error: "Not paid yet" - keep waiting. |
    | `INVALID_DELIVERY_OTP` | Let them re-enter, or resend. |
    | `INVALID_TRIP_STATUS_TRANSITION`, `TRIP_NOT_CANCELLABLE` | The trip moved on - re-read it and update the screen. |
    | `PAYMENT_PROVIDER_UNAVAILABLE` (503) | "Payment service is busy - try again in a moment". |

    The complete list with causes is in *Errors*.
  x-traitTag: true
- name: Payments (Razorpay)
  description: |-
    ## Two ways a delivery is paid

    | `payment_mode` | What it means | What the driver does at the drop |
    |---|---|---|
    | `prepaid` | You settled the money outside this system. The trip is marked **paid** the moment it is booked. | Nothing to collect - hand over the goods. |
    | `cod` | **Cash on delivery.** The customer pays the driver at the drop. | Shows a **Razorpay QR code** for the exact fare; the customer scans it with any UPI app. |

    This guide is about the second one: how the QR is made, how the platform finds out it was paid, and how to set it up.

    ## How a cash-on-delivery payment works

    ```
     Driver app                     This API                          Razorpay                 Customer
         │  GET .../payment/qr          │                                │                         │
         ├─────────────────────────────▶│  create single-use QR (₹85)    │                         │
         │                              ├───────────────────────────────▶│                         │
         │◀─────────────────────────────┤◀───────────────────────────────┤                         │
         │  image_url, expires_at       │                                │                         │
         │  ── shows the QR ─────────────────────────────────────────────────────────────────────▶ │
         │                              │                                │◀── scans & pays (UPI) ──┤
         │                              │◀── webhook qr_code.credited ───┤                         │
         │                              │  verify signature, check amount │                        │
         │                              │  trip.payment_status = paid     │                         │
         │                              │  SMS delivery OTP ──────────────────────────────────────▶│
         │  poll GET /driver/trips/{id} │                                │                         │
         │◀─ payment_status: paid ──────┤                                │                         │
         │  customer reads OTP ◀──────────────────────────────────────────────────────────────────┤
         │  POST .../complete {otp}     │                                                          │
         ├─────────────────────────────▶│  trip completed, driver credited                         │
    ```

    Key points:

    - **The QR is created by Razorpay, per trip, for exactly the trip's fare.** It is *single-use*: once paid it closes, so a screenshot cannot be paid twice, and it is fixed-amount, so a customer cannot pay the wrong sum.
    - **Money confirmation comes from Razorpay, never from the driver's word.** The trip is marked paid only when the server has confirmed - through Razorpay's signed webhook, or by asking Razorpay when the driver taps *Check payment* - that a captured payment **covering the full fare** exists for this trip's code.
    - **The customer's delivery OTP is texted at that moment.** The driver cannot complete a cash-on-delivery trip without it, so completion cannot happen before payment does.
    - **The driver app doesn't have to poll a payments endpoint**: it re-reads the trip and watches `payment_status` (the reference app checks every 3 seconds while the QR is on screen).

    ## The endpoints involved

    | Step | Endpoint | Who |
    |---|---|---|
    | Show the code | `GET /driver/trips/{id}/payment/qr` | driver app |
    | "Check payment" | `POST /driver/trips/{id}/payment/collect` | driver app |
    | Resend the OTP | `POST /driver/trips/{id}/delivery-otp/resend` | driver app |
    | Finish | `POST /driver/trips/{id}/complete` (with `otp`) | driver app |
    | Razorpay tells us | `POST /webhooks/razorpay` | **Razorpay** |
    | Read the result | `GET /trips/{id}` -> `payment_status`, `cod_collected_at`, `payment_reference` | company |

    ## The QR code

    `GET /driver/trips/{id}/payment/qr` returns:

    ```json
    {
      "provider": "razorpay",
      "reference": "qr_Nx4a1Kp0aB9cXz",
      "image_url": "https://rzp.io/i/Nx4a1Kp",
      "qr_payload": null,
      "amount": 85.0,
      "currency": "INR",
      "expires_at": "2026-09-21T10:15:00Z"
    }
    ```

    - Show **`image_url`** as an image, large and on a white background. It is a ready-made QR image hosted by Razorpay; don't try to draw it yourself.
    - **Asking again returns the same code** while it is valid - reopening the screen never creates a second one. After `expires_at` (30 minutes) a fresh code is issued. Show a countdown and a "Get a new code" button.
    - If the customer has in fact already paid (the webhook was late), the call answers **`409 ALREADY_PAID`** - go straight to the OTP.
    - The code is only issued for a **cash-on-delivery** trip that is **in progress**, and, when the order asks for item verification, only after **every item is answered**.

    ## "Check payment"

    `POST /driver/trips/{id}/payment/collect` asks the server to look at Razorpay *now*:

    | Answer | Meaning |
    |---|---|
    | `200` + message | Paid. The trip is marked paid and the customer has been texted their OTP. |
    | `409 PAYMENT_NOT_RECEIVED` | **Not a fault.** No full payment for this code yet. Ask the customer to pay; check again in a moment. |
    | `409 ALREADY_PAID` | The webhook already confirmed it. Carry on to the OTP. |
    | `503 PAYMENT_PROVIDER_UNAVAILABLE` | Razorpay couldn't be reached. Try again shortly. Nothing was charged. |

    ## Setting it up (for the person running the server)

    1. **Razorpay account.** Use your **Test mode** keys while developing. This uses Razorpay's *QR Codes* product, which is an **on-demand feature**: until Razorpay support activates it on your account (Test and Live are separate), asking for a code fails with `503 PAYMENT_PROVIDER_NOT_CONFIGURED` and a message saying so - even though the keys themselves are valid. Any other refusal comes back as `PAYMENT_PROVIDER_ERROR` with Razorpay's reason.
    2. **Server settings** (environment variables):

       | Variable | Value |
       |---|---|
       | `PAYMENT_PROVIDER` | `razorpay` (the default). `upi_static` is a development-only stand-in - see below. |
       | `RAZORPAY_KEY_ID` | Your Razorpay key id (`rzp_test_...` / `rzp_live_...`). |
       | `RAZORPAY_KEY_SECRET` | Its secret. Keep it server-side. |
       | `RAZORPAY_WEBHOOK_SECRET` | The secret you set on the webhook in step 3. |
       | `RAZORPAY_QR_VALID_MINUTES` | How long a code stays payable. Default `30` (Razorpay's minimum is 2). |
       | `RAZORPAY_TIMEOUT_SECONDS` | How long to wait for Razorpay. Default `10`. |

    3. **Webhook.** In the Razorpay Dashboard -> Settings -> Webhooks -> *Add new webhook*: URL `https://<your-domain>/api/v1/webhooks/razorpay`, secret = the value of `RAZORPAY_WEBHOOK_SECRET`, and tick the event **QR Code -> `qr_code.credited`**.
    4. **Try it in Test mode**: book a cash-on-delivery trip, drive it to `in_progress`, open the QR and pay it from the Razorpay test tools.

    Until the keys are set, asking for a code fails with `503 PAYMENT_PROVIDER_NOT_CONFIGURED`, and until the webhook secret is set the webhook answers `503 WEBHOOK_NOT_CONFIGURED`. In that state a driver can still confirm by tapping *Check payment*
    - but **without the webhook the payment is only noticed when they tap it**.

    ### The webhook

    `POST /webhooks/razorpay` is called by Razorpay, not by you. Each request is authenticated by the **`X-Razorpay-Signature`** header - the hex HMAC-SHA256 of the raw body keyed with your webhook secret. Anything else is
    refused with `400 INVALID_SIGNATURE`. It answers `200` with `{"status": "..."}` for every event it understood, so Razorpay never retries needlessly:

    | `status` | Meaning |
    |---|---|
    | `paid` | The trip is now paid; the OTP was sent. |
    | `already_paid` | A repeat delivery of an event already handled. Nothing changed. |
    | `underpaid` | The payment was less than the fare. The trip stays unpaid. |
    | `trip_not_in_progress` | Money arrived for a trip no longer in progress. Nothing was marked paid - **refund it manually**. |
    | `unknown_qr` | No trip owns this code. |
    | `ignored` | Some other Razorpay event. |

    Redelivery is safe: the same payment can never pay a trip twice, and a trip's OTP is only sent once.

    ## Edge cases

    | Situation | What happens |
    |---|---|
    | The customer pays **less** than the fare | Not accepted (the code is fixed-amount, so this is rare). The trip stays unpaid; the driver sees `PAYMENT_NOT_RECEIVED`. |
    | The code **expires** unpaid | Asking again issues a new one. The old one can no longer be paid. |
    | The **webhook is delayed or lost** | The driver taps *Check payment*; the server asks Razorpay directly and finds the payment. |
    | **Razorpay is down** | `503 PAYMENT_PROVIDER_UNAVAILABLE` on the QR / check calls. Retry shortly; nothing was charged. |
    | The customer's **SMS OTP doesn't arrive** | The driver taps *Resend OTP* (once per 30 s per trip). |
    | The customer pays **twice** | The code is single-use and closes after the first payment. |

    ## Reconciling

    Every paid cash-on-delivery trip carries Razorpay's payment id in **`payment_reference`** (`pay_...`) and the time in `cod_collected_at` (both on `GET /trips/{id}`). Match `payment_reference` against
    the payments in your Razorpay dashboard; the code's own id (`qr_...`) is in the QR response's `reference`.

    ## Developing without Razorpay

    Two options, neither of which is for production:

    - **`scripts/dev_razorpay_stub.py`** - a local stand-in for Razorpay's QR Codes API. Point `RAZORPAY_API_BASE` at it and use fake keys; it can "pay" a code (with or without sending the webhook) so you can exercise the whole flow, including underpayment. It proves *our* plumbing - not that real Razorpay accepts it, so also try Test mode.
    - **`PAYMENT_PROVIDER=upi_static`** - the response carries a plain UPI link (`qr_payload`, no `image_url`, no `expires_at`) drawn as a QR against `COMPANY_UPI_VPA`. **Nothing can confirm that a payment happened**, so the driver's "payment received" tap is taken on trust. Never use it with real money.
  x-traitTag: true
- name: Items & invoices
  description: |-
    ## What you can attach to a trip

    When you book a trip you may describe the goods and attach the invoice. Both are optional, and both travel with the trip to the driver's app.

    | You send | The driver gets |
    |---|---|
    | `invoice_url` (+ `invoice_number`) | An **invoice card** with a **Download** button, and buttons to **share it on WhatsApp** or via the phone's share sheet - so the driver can hand the customer their invoice. |
    | `items[]` | A list of what is being delivered (name, quantity, unit, SKU, notes, picture). |
    | `verify_items: true` | A **checklist**: at the drop the driver must answer for **every item** - and can take a photo of each. |

    ## The invoice

    - Pass **`invoice_url`** - a link to a PDF or image, `http(s)` only. Either **host it yourself**, or **upload it** with `POST /uploads` (`purpose: trip_invoice`, image or PDF) and pass the URL that comes back.
    - `invoice_number` is the number printed on it (shown on the card).
    - The URL is returned on the trip as an **absolute URL** so the driver's phone can open it as is.

    ## Items

    Each entry in `items` (at most 100 per trip):

    | Field | Required | Notes |
    |---|:-:|---|
    | `name` | **yes** | What it is, up to 200 characters. |
    | `quantity` | no | Whole number 1 - 1,000,000. Default `1`. |
    | `unit` | no | Free text: `pcs`, `kg`, `box`, `bags`. |
    | `sku` | no | Your product code. |
    | `notes` | no | A handling note: "Keep dry", "Fragile". |
    | `image_url` | no | A picture of the item, `http(s)`. Upload one with `purpose: trip_item_image`. |
    | `unit_price` | no | Decimal, for the driver's information only - it does not change the fare. |

    Items keep the order you sent them (`position`).

    ## Verification: proof of what was delivered

    Set **`verify_items: true`** (with at least one item) to make the driver *confirm the delivery of each line*. That confirmation is stored as your **delivery history**.

    **At the drop** (once the trip is `in_progress`), for each item the driver chooses:

    - **Delivered** - optionally with a **photo** taken on the spot with the phone's camera (the app only accepts fresh camera shots as proof, not gallery pictures), or
    - **Not delivered** - with a **note saying what happened** (required), optionally with a photo.

    A wrong tap can be undone (the item goes back to `pending`, and its note and photo are dropped) until the trip is completed. Answering again replaces the earlier answer.

    **Until every item has an answer, the trip cannot be paid or completed.** Asking for the payment QR, confirming the payment, or completing all fail with `409 ITEMS_NOT_VERIFIED`. "Not delivered" is an answer - it unblocks the trip - so
    a damaged or refused item doesn't strand the delivery.

    ### What you can read afterwards

    `GET /trips/{id}` returns each item with the driver's answer:

    ```json
    {
      "id": "d3035b1c-78ce-44a0-b408-1d1c46c7916f",
      "position": 0,
      "name": "Cement bag 50 kg",
      "quantity": 4,
      "status": "delivered",
      "verified_at": "2026-09-21T10:04:12.310000Z",
      "proof_image_url": "https://your-server/media/.../delivery-proofs/9c1e....jpg",
      "driver_note": ""
    }
    ```

    | Field | Meaning |
    |---|---|
    | `status` | `pending` (not yet answered), `delivered` or `not_delivered`. |
    | `verified_at` | When the driver answered. `null` while pending. |
    | `proof_image_url` | The driver's photo, or `null`. |
    | `driver_note` | What the driver wrote (always present for `not_delivered`). |

    ## The endpoints

    | Purpose | Endpoint |
    |---|---|
    | Upload an invoice / item picture | `POST /uploads` |
    | Book with `invoice_url`, `items`, `verify_items` | `POST /trips` |
    | Read the delivery history | `GET /trips/{id}` |
    | The driver answers an item | `POST /driver/trips/{id}/items/{item_id}/verify` (multipart) |
    | The driver takes an answer back | `DELETE /driver/trips/{id}/items/{item_id}/verify` |

    ## Rules at a glance

    - `verify_items` needs at least one item, or booking fails with `INVALID`.
    - Verification happens **only while the trip is `in_progress`** (`TRIP_NOT_IN_PROGRESS` otherwise), and only on orders booked with `verify_items` (`VERIFICATION_NOT_REQUESTED` otherwise).
    - Photos must be images (`jpg`, `jpeg`, `png`, `webp`), up to 10 MB, and are checked by content.
    - The driver only ever sees their own trips' items; another driver's trip is a `404`.
  x-traitTag: true
- name: Driver onboarding & wallet
  description: |-
    ## Joining: self sign-up and onboarding

    A driver can be **created by the company** (`POST /drivers`, admin token) or can **sign themselves up** from the app: signing in with a phone number nobody has registered - when the server allows self sign-up -
    creates a brand-new, empty driver account. Either way a driver **cannot receive trips until the company has verified their documents**.

    ### The journey

    ```
     sign up (SMS OTP)         about me           documents              company review          approved
     profile_incomplete ──▶ documents_required ──▶ under_review ──▶  approved
                                                       │  ▲
                                              rejected │  │ re-submit
                                                       ▼  │
                                                  action_required
    ```

    `onboarding_status` (on `GET /driver/me` and in the company's driver list) says where a driver is. It is **derived, never stored**, from their profile and the state of their documents:

    | `onboarding_status` | Meaning | What happens next |
    |---|---|---|
    | `profile_incomplete` | Missing name, date of birth or emergency contact. | The driver fills in *about me* (`PATCH /driver/me`). |
    | `documents_required` | Profile done; Aadhaar or licence not yet uploaded. | The driver uploads them. |
    | `under_review` | Everything provided; waiting on the company. | The company verifies (below). |
    | `action_required` | The company **rejected** a document. `kyc.<doc>.rejection_note` says why. | The driver fixes and re-submits. |
    | `approved` | Aadhaar, licence and police all verified, licence unexpired, account active. | The driver can go on duty and receive trips. |

    A driver the company created and verified is `approved` regardless of profile details.

    ### What the driver provides

    | Item | Endpoint (multipart where files) | Notes |
    |---|---|---|
    | About me | `PATCH /driver/me` | Name, date of birth (18-80), email, address, city, pincode, **emergency contact** (not their own number), payout details. All optional individually. |
    | Selfie | `POST /driver/me/photo` | `photo` |
    | **Aadhaar** | `POST /driver/me/kyc/aadhar` | `number` (12 digits), `front`, `back`. **Only the last 4 digits of the number are kept.** |
    | **Driving licence** | `POST /driver/me/kyc/dl` | `number`, `expiry_date` (future), `front`, `back` (optional). |
    | **Police verification** | `POST /driver/me/kyc/police` | `document` (image or PDF). Optional to upload - the company may verify it another way. |
    | Payout details | `PATCH /driver/me` | A `payout_upi_id` *or* bank details (`bank_account_holder`, `bank_account_number`, `bank_ifsc` - all three). |

    Each upload replaces the previous one and puts that document back in review. Once the company has **verified** a document it is **locked** (`KYC_ALREADY_VERIFIED`), and after Aadhaar is verified the driver's
    **name and date of birth are locked too** (`PROFILE_LOCKED`).

    ### The company reviews (admin token)

    `GET /drivers` lists your drivers, each with its `onboarding_status` (filter with `aadhar_status`, `dl_status`, `police_status` or `account_status` - e.g. `?dl_status=pending` for licences waiting on you), and `GET /drivers/{id}/kyc` shows the scans. Then decide each document:

    ```bash
    curl -X PATCH "$BASE_URL/drivers/$DRIVER/kyc/aadhar" -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" -d '{"status": "verified"}'
    curl -X PATCH "$BASE_URL/drivers/$DRIVER/kyc/police" -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" -d '{"status": "rejected", "note": "Certificate is unreadable - please upload a clearer scan"}'
    curl -X PATCH "$BASE_URL/drivers/$DRIVER/kyc/dl"     -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
      -d '{"status": "verified", "expiry_date": "2031-06-30", "allowed_categories": ["two_wheeler", "three_wheeler"]}'
    ```

    - A **rejection needs a `note`** - the driver sees it.
    - Verifying the **licence** also needs the `expiry_date` you read off it (in the future) and the `allowed_categories` it covers: that decides which vehicles the driver may take (`two_wheeler`, `three_wheeler`, `four_wheeler`).
    - When a verified licence's expiry date passes, the driver's account is **locked** automatically (`ACCOUNT_LOCKED`) until a new licence is verified.

    ## The wallet

    Every driver has a **wallet**: a running ledger of what the company owes them.

    - **Earning**: when a trip completes, the driver is credited a share of its fare - **80% by default** (`DRIVER_EARNING_PERCENT`); the rest is the company's margin. The trip shows it as `driver_earning`.
    - **Payouts** happen **outside** this system (bank or UPI transfer by the company). The company then **records** each one (`POST /drivers/{id}/wallet/transactions`, `kind: payout`) which lowers the balance. The driver's payout details (`GET /driver/me` -> `payout`) say where to send it.
    - The company can also record a **bonus** (adds), a **penalty** (subtracts) or an **adjustment** (a correction, either sign).
    - The ledger is **append-only**. A mistake is fixed by another entry, never by editing history - so the driver's statement always adds up. Each row carries the running `balance_after`.

    | Kind | Effect on the balance | Who creates it |
    |---|---|---|
    | `trip_earning` | + | the system, on trip completion |
    | `bonus` | + | the company |
    | `penalty` | - | the company |
    | `payout` | - | the company (after paying the driver) |
    | `adjustment` | + or - | the company |

    **Balance** = every credit minus every payout, penalty and negative adjustment. **Earnings** (today / week / month / lifetime) count trip earnings and bonuses only.

    | Who | Reads it | Records entries |
    |---|---|---|
    | The driver | `GET /driver/wallet` (summary), `GET /driver/wallet/transactions` (statement), `GET /driver/stats` | - |
    | The company (admin) | `GET /drivers/{id}/wallet` (balance + last 20 entries) | `POST /drivers/{id}/wallet/transactions` |

    A payout larger than the balance is refused (`INSUFFICIENT_BALANCE`), so read the balance first.

    ## Leaving

    A driver can **delete their own account** (`DELETE /driver/me`) - an app-store requirement for apps with self sign-up. It is refused while they have an **active trip** or while the company still **owes them money**
    (`WALLET_BALANCE_PENDING`: pay the balance out first). A deleted (or company-removed) driver is disabled and signed out; their trips and wallet history are kept.
  x-traitTag: true
- name: Company authentication
  description: Get the bearer token every other company call needs. **Server-to-server
    integrations** use an API client (`client-token`); the company's own admin panel
    signs in with email + password.
- name: Trips
  description: Book deliveries and follow them. A trip is priced up-front, matched
    to the nearest eligible driver automatically, and then driven by the driver's
    app through its lifecycle - see the **Trip lifecycle** guide.
- name: Vehicle types
  description: The categories you sell (Bike, Mini truck, ...) with their fare card.
    A trip is booked against one vehicle type.
- name: Vehicles
  description: The company's physical fleet. Drivers pick a free vehicle when they
    go on duty.
- name: Vehicle documents
  description: Registration, insurance and other paperwork attached to a vehicle.
- name: Drivers
  description: Create and manage the company's drivers, and review the KYC documents
    they submit from the app.
- name: Driver wallets
  description: 'The company''s side of a driver''s earnings ledger: read a balance,
    then record payouts, bonuses, penalties and corrections.'
- name: Uploads
  description: Store a file (invoice, item photo, vehicle photo, ...) and get back
    a URL to use in another request.
- name: Driver sign-in
  description: Phone-number + SMS OTP login for drivers, and keeping the session alive.
    New numbers become new (unapproved) drivers automatically.
- name: Driver profile & onboarding
  description: The signed-in driver's own profile, KYC submissions (Aadhaar, licence,
    police verification, photo) and account controls.
- name: Driver duty & location
  description: Going on and off duty with a vehicle, and sending GPS pings so trips
    can be matched.
- name: Driver trips
  description: 'The trip the driver is working on, its history, and the step-by-step
    lifecycle actions: arrive, start, complete, cancel.'
- name: Driver payments
  description: 'Cash-on-delivery: the Razorpay scan-to-pay code, confirming the payment,
    and the delivery OTP.'
- name: Item verification
  description: 'For orders that ask the driver to confirm each item: mark delivered
    / not delivered, optionally with a camera photo.'
- name: Driver earnings
  description: The signed-in driver's wallet ledger and today's/all-time delivery
    stats.
- name: Razorpay webhook
  description: The one endpoint Razorpay calls (you don't). Documented so you can
    configure the webhook and understand what it does.
