                  summary: ITEMS_NOT_VERIFIED
                PAYMENTNOTCOLLECTED:
                  value:
                    success: false
                    error:
                      code: PAYMENT_NOT_COLLECTED
                      message: Collect the COD payment first; that's what sends the
                        OTP.
                  summary: PAYMENT_NOT_COLLECTED
                INVALIDTRIPSTATUSTRANSITION:
                  value:
                    success: false
                    error:
                      code: INVALID_TRIP_STATUS_TRANSITION
                      message: Trip must be 'arrived_at_pickup' to do this (currently
                        'assigned').
                  summary: INVALID_TRIP_STATUS_TRANSITION
          description: |-
            One of:
            - `ITEMS_NOT_VERIFIED` - The order asked for its items to be verified (`verify_items: true`) and some are still unanswered. Payment and completion are blocked until every item is marked delivered / not delivered.
            - `PAYMENT_NOT_COLLECTED` - `complete` was called on a COD trip before its payment was confirmed.
            - `INVALID_TRIP_STATUS_TRANSITION` - The driver action isn't valid for the trip's current status (e.g. `start` before `arrive`).
