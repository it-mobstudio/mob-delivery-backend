  /webhooks/razorpay:
    post:
      operationId: razorpayWebhook
      description: |-
        **You do not call this - Razorpay does.** When a customer pays a trip's QR code, Razorpay sends a `qr_code.credited` event here; the server finds the trip that owns
        that code and, if the payment covers the fare, marks it **paid** and texts the customer their delivery OTP. That is what lets the driver's payment screen move on by itself.

        **Set it up** in the Razorpay Dashboard -> Settings -> Webhooks: URL `https://<your-domain>/api/v1/webhooks/razorpay`, event **QR Code -> `qr_code.credited`**, and a
        secret of your choosing, which you also set on the server as `RAZORPAY_WEBHOOK_SECRET`.

        **Security.** There is no bearer token - Razorpay can't log in. Every call is authenticated by `X-Razorpay-Signature`: the hex HMAC-SHA256 of the raw body keyed with the webhook secret.
        Anything not signed with it is refused (`INVALID_SIGNATURE`), and if the server has no secret it refuses everything (`WEBHOOK_NOT_CONFIGURED`).
        Redeliveries are harmless: an already-paid trip is never paid twice.

        To test by hand, sign the exact bytes you send:

        ```python
        import hmac, hashlib
        signature = hmac.new(SECRET.encode(), body_bytes, hashlib.sha256).hexdigest()
        ```

        Every understood event answers `200` with what was done (so Razorpay stops retrying), even when nothing was marked paid - see `status` below.

        **Who may call this:** **No token needed.**
      summary: Razorpay reports a payment
      parameters:
      - in: header
        name: X-Razorpay-Signature
        schema:
          type: string
        description: Hex HMAC-SHA256 of the **raw request body**, keyed with the webhook
          secret. Razorpay adds it; you only need it to test by hand.
        required: true
      tags:
      - Razorpay webhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RazorpayEventRequest'
            examples:
              RazorpayQrCodeCredited:
                value:
                  entity: event
                  event: qr_code.credited
                  contains:
                  - qr_code
                  - payment
                  payload:
                    qr_code:
                      entity:
                        id: qr_Nx4a1Kp0aB9cXz
                        entity: qr_code
                        status: closed
                        payments_amount_received: 8500
                    payment:
                      entity:
                        id: pay_Nx4b2Lq1cC0dYa
                        entity: payment
                        amount: 8500
                        currency: INR
                        status: captured
                        method: upi
                  created_at: 1789971822
                summary: 'Razorpay: qr_code.credited'
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALIDSIGNATURE:
                  value:
                    success: false
                    error:
                      code: INVALID_SIGNATURE
                      message: The webhook signature doesn't match.
                  summary: INVALID_SIGNATURE
                INVALIDPAYLOAD:
                  value:
                    success: false
                    error:
                      code: INVALID_PAYLOAD
                      message: The webhook body isn't a JSON object.
                  summary: INVALID_PAYLOAD
          description: |-
            One of:
            - `INVALID_SIGNATURE` - The webhook's `X-Razorpay-Signature` doesn't match the body - it wasn't sent by Razorpay (or the secret is wrong).
            - `INVALID_PAYLOAD` - The webhook body isn't a JSON object.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                WEBHOOKNOTCONFIGURED:
                  value:
                    success: false
                    error:
                      code: WEBHOOK_NOT_CONFIGURED
                      message: Payment webhooks aren't set up on this server.
                  summary: WEBHOOK_NOT_CONFIGURED
          description: '`WEBHOOK_NOT_CONFIGURED` - The server has no webhook secret,
            so it can''t tell real Razorpay calls from fake ones and refuses all of
            them.'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResult'
              examples:
                Paid:
                  value:
                    status: paid
                  summary: The trip is now paid
                Underpaid:
                  value:
                    status: underpaid
                  summary: Paid less than the fare
                AlreadyPaid:
                  value:
                    status: already_paid
                  summary: A repeat delivery
          description: Success.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "$BASE_URL/webhooks/razorpay" \
            -H "Content-Type: application/json" \
            -d '{
              "entity": "event",
              "event": "qr_code.credited",
              "contains": [
                "qr_code",
                "payment"
              ],
              "payload": {
                "qr_code": {
                  "entity": {
                    "id": "qr_Nx4a1Kp0aB9cXz",
                    "entity": "qr_code",
                    "status": "closed",
                    "payments_amount_received": 8500
                  }
                },
                "payment": {
                  "entity": {
                    "id": "pay_Nx4b2Lq1cC0dYa",
                    "entity": "payment",
                    "amount": 8500,
                    "currency": "INR",
                    "status": "captured",
                    "method": "upi"
                  }
                }
              },
              "created_at": 1789971822
            }'
      - lang: Python
        label: Python
        source: |-
          import requests

          BASE_URL = "http://localhost:8000/api/v1"

          response = requests.post(
              f"{BASE_URL}/webhooks/razorpay",
              json={
                  "entity": "event",
