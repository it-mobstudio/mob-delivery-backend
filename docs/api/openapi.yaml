            - `TOKEN_NOT_VALID` - The bearer token is expired, malformed, or was signed by another environment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DRIVERNOTELIGIBLE:
                  value:
                    success: false
                    error:
                      code: DRIVER_NOT_ELIGIBLE
                      message: This driver's KYC is incomplete or their account is
                        not active.
                  summary: DRIVER_NOT_ELIGIBLE
                VEHICLECATEGORYNOTALLOWED:
                  value:
                    success: false
                    error:
                      code: VEHICLE_CATEGORY_NOT_ALLOWED
                      message: Your driving licence is not verified for this type
                        of vehicle.
                  summary: VEHICLE_CATEGORY_NOT_ALLOWED
                PERMISSIONDENIED:
                  value:
                    success: false
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                  summary: PERMISSION_DENIED
          description: |-
            One of:
            - `DRIVER_NOT_ELIGIBLE` - The driver can't go on duty: KYC isn't fully verified or the account isn't active.
            - `VEHICLE_CATEGORY_NOT_ALLOWED` - The driver's verified licence doesn't cover this vehicle's category.
            - `PERMISSION_DENIED` - You are signed in, but this kind of token may not use this endpoint (e.g. a driver token on a company endpoint, or the reverse).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
