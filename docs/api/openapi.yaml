                  summary: WALLET_BALANCE_PENDING
          description: |-
            One of:
            - `DRIVER_HAS_ACTIVE_TRIP` - The driver can't do this (go off duty, change vehicle, delete the account, be disabled) while a trip is active.
            - `WALLET_BALANCE_PENDING` - The driver tried to delete their account while the company still owes them money.
        '204':
          description: Account closed. No body.
