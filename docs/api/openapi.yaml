  /driver/trips/{id}/navigation:
    get:
      operationId: driverGetNavigation
      description: |-
        The route the driver still has to drive, **from where they are now** (`lat`/`lng`) to the trip's next stop: the **pickup** until they have started the delivery,
        the **drop** after. (The trip's own `route_polyline` only covers pickup -> drop; this is the "get me to the pickup" part.)
        The polyline is encoded at 6 decimal places, not Google's 5.

        **Who may call this:** **Driver** - a driver token only.
      summary: Route to my next stop
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: The trip's id (UUID) - from `GET /driver/trips/active` or the
          trip list.
        required: true
      - in: query
        name: lat
        schema:
          type: number
          format: double
        description: The driver's current latitude, decimal degrees (-90 to 90).
        required: true
      - in: query
        name: lng
        schema:
          type: number
          format: double
        description: The driver's current longitude, decimal degrees (-180 to 180).
        required: true
      tags:
      - Driver trips
      security:
      - DriverToken: []
      responses:
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTAUTHENTICATED:
                  value:
                    success: false
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                  summary: NOT_AUTHENTICATED
                TOKENNOTVALID:
                  value:
                    success: false
                    error:
                      code: TOKEN_NOT_VALID
                      message: Given token not valid for any token type
                  summary: TOKEN_NOT_VALID
          description: |-
            One of:
            - `NOT_AUTHENTICATED` - No `Authorization` header was sent.
            - `TOKEN_NOT_VALID` - The bearer token is expired, malformed, or was signed by another environment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PERMISSIONDENIED:
                  value:
                    success: false
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                  summary: PERMISSION_DENIED
          description: '`PERMISSION_DENIED` - You are signed in, but this kind of
            token may not use this endpoint (e.g. a driver token on a company endpoint,
            or the reverse).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTFOUND:
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: No Trip matches the given query.
                  summary: NOT_FOUND
          description: '`NOT_FOUND` - No such resource - or it belongs to another
            company. The API never confirms that other companies'' data exists.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TRIPNOTACTIVE:
                  value:
                    success: false
                    error:
                      code: TRIP_NOT_ACTIVE
                      message: A trip in status 'completed' has nothing left to navigate.
                  summary: TRIP_NOT_ACTIVE
          description: '`TRIP_NOT_ACTIVE` - Navigation was requested for a trip that
            has nothing left to navigate to (completed or cancelled).'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ROUTINGUNAVAILABLE:
                  value:
                    success: false
                    error:
                      code: ROUTING_UNAVAILABLE
                      message: Could not compute a route for this pickup/drop pair.
                  summary: ROUTING_UNAVAILABLE
          description: '`ROUTING_UNAVAILABLE` - The routing engine couldn''t route
            between the pickup and the drop (out of coverage, or the engine is down).'
