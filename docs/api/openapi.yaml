  /uploads:
    post:
      operationId: uploadFile
      description: |-
        Stores one file under your company and returns its **absolute URL**. Use it wherever another request wants a file URL: `invoice_url` and an item's `image_url` when
        booking a trip, a vehicle type's `icon_image_url`, a vehicle's `photo_url`, a vehicle document's `file_url`.

        Send as **`multipart/form-data`** with two parts: `file` and `purpose`. `purpose` decides where the file is kept and what is accepted:

        | `purpose` | Use it for | Accepted |
        |---|---|---|
        | `trip_invoice` | the invoice for a trip (`invoice_url`) | image or PDF |
        | `trip_item_image` | a picture of an item (`items[].image_url`) | image |
        | `vehicle_type_icon` | a vehicle type's icon | image |
        | `vehicle_photo` | a vehicle's photo | image |
        | `vehicle_document` | RC, insurance, ... | image or PDF |
        | `driver_document` | a driver's paperwork | image or PDF |
        | `driver_photo` | a driver's picture | image |
        | `delivery_proof` | proof-of-delivery photos | image |

        Images are `jpg`, `jpeg`, `png` or `webp`. The **content is checked** - a renamed text file, a corrupt image or a fake PDF is refused - and the size limit is 10 MB.

        **Who may call this:** **Company** - an API client token *or* an admin token.
      summary: Upload a file
      tags:
      - Uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      security:
      - ApiClientToken: []
      - AdminToken: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALIDUPLOAD:
                  value:
                    success: false
                    error:
                      code: INVALID_UPLOAD
                      message: 'Unsupported file type ''.pdf'' for purpose ''vehicle_photo''.
                        Allowed: [''jpeg'', ''jpg'', ''png'', ''webp''].'
                  summary: INVALID_UPLOAD
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: |-
            One of:
            - `INVALID_UPLOAD` - The file isn't an acceptable image/PDF (wrong type, too large, or corrupt).
            - `INVALID` - The request body, query string or form is missing a required field or has a value that isn't acceptable. `details` names every offending field.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTAUTHENTICATED:
                  value:
                    success: false
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                  summary: NOT_AUTHENTICATED
                TOKENNOTVALID:
                  value:
                    success: false
                    error:
                      code: TOKEN_NOT_VALID
                      message: Given token not valid for any token type
                  summary: TOKEN_NOT_VALID
          description: |-
            One of:
            - `NOT_AUTHENTICATED` - No `Authorization` header was sent.
            - `TOKEN_NOT_VALID` - The bearer token is expired, malformed, or was signed by another environment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PERMISSIONDENIED:
                  value:
                    success: false
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                  summary: PERMISSION_DENIED
          description: '`PERMISSION_DENIED` - You are signed in, but this kind of
            token may not use this endpoint (e.g. a driver token on a company endpoint,
            or the reverse).'
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
              examples:
                Stored:
                  value:
                    url: https://api.example.com/media/3b79be44-897b-43f7-8856-ce12c23e82ab/trip-invoices/525c9e10-884f-401a-b84a-8f8a1c99d4c8.pdf
                  summary: Stored
          description: Created.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "$BASE_URL/uploads" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -F 'file=@/path/to/photo.jpg' \
            -F 'purpose=vehicle_type_icon'
      - lang: Python
        label: Python
        source: |-
          import requests

          BASE_URL = "http://localhost:8000/api/v1"
          ACCESS_TOKEN = "..."  # see the Authentication guide

          response = requests.post(
              f"{BASE_URL}/uploads",
              headers={"Authorization": f"Bearer {ACCESS_TOKEN}"},
              files={"file": open("photo.jpg", "rb")},
