  /driver/trips/{id}/payment/collect:
    post:
      operationId: driverConfirmPayment
      description: |-
        The driver's **"Check payment"** button. With Razorpay, the server **asks Razorpay** whether this trip's code has been paid (in full) - it does not take the driver's word for it:

        - **Paid** -> the trip is marked paid, the customer is texted their **delivery OTP**, and this returns `200`.
        - **Not paid (yet)** -> `409 PAYMENT_NOT_RECEIVED`. That is *not a fault*: ask the customer to scan and pay, then check again in a moment.
        - Already paid (the webhook got there first) -> `409 ALREADY_PAID`: carry on to the OTP.

        The app doesn't need to poll this: the server marks the trip paid as soon as Razorpay's webhook arrives, so simply re-reading the trip (`GET /driver/trips/{id}`, `payment_status`) shows it.
        On a non-production server the response also echoes the delivery OTP in `otp`.

        **Who may call this:** **Driver** - a driver token only.

        **The cash-on-delivery flow:** items verified (if asked) -> `GET .../payment/qr` shows the customer a Razorpay code for the exact fare -> the customer pays with any UPI app ->
        Razorpay tells the server, which marks the trip **paid** and texts the customer their delivery OTP -> the driver enters that OTP in `POST .../complete`.
        The driver's tap on "check payment" (`POST .../payment/collect`) never takes anyone's word for it - the server asks Razorpay. See the **Payments (Razorpay)** guide.
      summary: Check the payment and send the delivery OTP
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: The trip's id (UUID).
        required: true
      tags:
      - Driver payments
      security:
      - DriverToken: []
      responses:
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTAUTHENTICATED:
                  value:
                    success: false
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                  summary: NOT_AUTHENTICATED
                TOKENNOTVALID:
                  value:
                    success: false
                    error:
                      code: TOKEN_NOT_VALID
                      message: Given token not valid for any token type
                  summary: TOKEN_NOT_VALID
          description: |-
            One of:
            - `NOT_AUTHENTICATED` - No `Authorization` header was sent.
            - `TOKEN_NOT_VALID` - The bearer token is expired, malformed, or was signed by another environment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTYOURTRIP:
                  value:
                    success: false
                    error:
                      code: NOT_YOUR_TRIP
                      message: This trip is not assigned to you.
                  summary: NOT_YOUR_TRIP
                PERMISSIONDENIED:
                  value:
                    success: false
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                  summary: PERMISSION_DENIED
          description: |-
            One of:
            - `NOT_YOUR_TRIP` - A driver called a trip endpoint for a trip that isn't assigned to them.
            - `PERMISSION_DENIED` - You are signed in, but this kind of token may not use this endpoint (e.g. a driver token on a company endpoint, or the reverse).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTFOUND:
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: No Trip matches the given query.
                  summary: NOT_FOUND
          description: '`NOT_FOUND` - No such resource - or it belongs to another
            company. The API never confirms that other companies'' data exists.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENTNOTRECEIVED:
                  value:
                    success: false
                    error:
                      code: PAYMENT_NOT_RECEIVED
                      message: The customer's payment hasn't arrived yet. Ask them
                        to scan the code and pay, then check again in a moment.
                  summary: PAYMENT_NOT_RECEIVED
                ALREADYPAID:
                  value:
                    success: false
                    error:
                      code: ALREADY_PAID
                      message: This trip has already been paid.
                  summary: ALREADY_PAID
                NOTCODTRIP:
                  value:
                    success: false
                    error:
                      code: NOT_COD_TRIP
                      message: This trip is not COD; there's nothing to collect.
                  summary: NOT_COD_TRIP
                TRIPNOTINPROGRESS:
                  value:
                    success: false
                    error:
                      code: TRIP_NOT_IN_PROGRESS
                      message: The payment code is shown at the drop, once the delivery
                        has started.
                  summary: TRIP_NOT_IN_PROGRESS
                ITEMSNOTVERIFIED:
                  value:
                    success: false
                    error:
                      code: ITEMS_NOT_VERIFIED
                      message: Verify every item on this order before continuing.
                  summary: ITEMS_NOT_VERIFIED
          description: |-
            One of:
            - `PAYMENT_NOT_RECEIVED` - The driver asked the server to confirm the payment, and the payment provider has no payment for this trip's code yet (or it was for less than the fare).
            - `ALREADY_PAID` - The trip's fare has already been paid (the customer scanned an earlier code, or it was collected already).
            - `NOT_COD_TRIP` - A payment step was used on a prepaid trip. Prepaid trips take no payment at the drop.
            - `TRIP_NOT_IN_PROGRESS` - The payment code is only available once the delivery has started (`in_progress`).
            - `ITEMS_NOT_VERIFIED` - The order asked for its items to be verified (`verify_items: true`) and some are still unanswered. Payment and completion are blocked until every item is marked delivered / not delivered.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENTPROVIDERERROR:
                  value:
                    success: false
                    error:
                      code: PAYMENT_PROVIDER_ERROR
                      message: 'The payment provider refused the request: The amount
                        must be at least INR 1.00'
                  summary: PAYMENT_PROVIDER_ERROR
          description: '`PAYMENT_PROVIDER_ERROR` - The payment provider (Razorpay)
            refused a request or sent an answer that couldn''t be read. The message
            says why.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENTPROVIDERUNAVAILABLE:
                  value:
                    success: false
                    error:
                      code: PAYMENT_PROVIDER_UNAVAILABLE
                      message: The payment provider is having trouble. Please try
                        again in a moment.
                  summary: PAYMENT_PROVIDER_UNAVAILABLE
                PAYMENTPROVIDERNOTCONFIGURED:
                  value:
                    success: false
                    error:
                      code: PAYMENT_PROVIDER_NOT_CONFIGURED
                      message: Online payments aren't set up on this server yet.
                  summary: PAYMENT_PROVIDER_NOT_CONFIGURED
          description: |-
            One of:
            - `PAYMENT_PROVIDER_UNAVAILABLE` - The payment provider couldn't be reached or is failing.
            - `PAYMENT_PROVIDER_NOT_CONFIGURED` - This server has no (valid) payment-provider keys - or the keys are valid but Razorpay's QR Codes product isn't activated on the account (Razorpay answers "The requested URL was not found" for that).
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCollected'
              examples:
                PaidOtpSentTestServerShowsTheCode:
                  value:
                    message: Payment collected. An OTP was sent to +919888800002 to
                      finalize the trip.
                    otp: '482913'
                  summary: Paid - OTP sent (test server shows the code)
          description: Success.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "$BASE_URL/driver/trips/${TRIP_ID}/payment/collect" \
            -H "Authorization: Bearer $DRIVER_TOKEN"
      - lang: Python
        label: Python
        source: |-
          import requests

          BASE_URL = "http://localhost:8000/api/v1"
          DRIVER_TOKEN = "..."  # see the Authentication guide

          response = requests.post(
              f"{BASE_URL}/driver/trips/{TRIP_ID}/payment/collect",
              headers={"Authorization": f"Bearer {DRIVER_TOKEN}"},
          )
          print(response.status_code, response.json())
      - lang: JavaScript
        label: JavaScript
        source: |-
