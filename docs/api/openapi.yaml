    PatchedDriverKycDecisionRequest:
      type: object
      description: Shared shape for the aadhar and police KYC decision endpoints.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/KycDecisionEnum'
          description: 'Your decision: `verified` or `rejected`. Required.'
        note:
          type: string
          description: Why - **required when `rejected`** (the driver sees it). Optional
            otherwise.
    PatchedDriverKycDlRequest:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/KycDecisionEnum'
          description: 'Your decision: `verified` or `rejected`. Required.'
        note:
          type: string
          description: Why - **required when `rejected`**.
        expiry_date:
          type: string
          format: date
          description: The licence's expiry date (`YYYY-MM-DD`). **Required when `verified`**;
            must be in the future.
        allowed_categories:
          type: array
          items:
            $ref: '#/components/schemas/VehicleCategoryEnum'
          description: The vehicle categories the licence covers, from `two_wheeler`,
            `three_wheeler`, `four_wheeler`. **Required when `verified`** (at least
            one).
    PatchedDriverProfileUpdateRequest:
      type: object
      description: |-
        PATCH /driver/me — the details a driver fills in about themselves.
        Everything is optional (a partial update); what's *required* to count as
        onboarded is Driver.is_profile_complete.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
          description: Full name, at least 2 characters. Locked once the Aadhaar is
            verified.
        date_of_birth:
          type: string
          format: date
          nullable: true
          description: '`YYYY-MM-DD`. The driver must be 18 to 80. Locked once the
            Aadhaar is verified.'
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
          description: Email address.
        address_line:
          type: string
          maxLength: 255
          description: Street address.
        city:
          type: string
          maxLength: 100
          description: City.
        pincode:
          type: string
          maxLength: 10
          description: 6-digit postal code.
        emergency_contact_name:
          type: string
          minLength: 1
          maxLength: 150
          description: Who to call if the driver needs help. Cannot be blank once
            sent.
        emergency_contact_phone:
          type: string
          minLength: 1
          maxLength: 20
          description: That person's number (10-15 digits). **Must not be the driver's
            own number.** Cannot be blank once sent.
        payout_upi_id:
          type: string
          maxLength: 100
          description: UPI id payouts are sent to, like `name@bank`. Send this *or*
            a full bank account.
        bank_account_holder:
          type: string
          maxLength: 150
          description: Name on the bank account. A bank account needs all of holder,
            number and IFSC.
        bank_account_number:
          type: string
          maxLength: 20
          description: Bank account number, 9-18 digits. Stored in full, shown back
            only as its last four digits.
        bank_ifsc:
          type: string
          maxLength: 11
          description: The branch's IFSC code, like `HDFC0001234` (upper-cased for
            you).
    PatchedDriverRequest:
      type: object
      description: |-
        Admin CRUD for the basic profile — verification statuses are managed
        exclusively through the KYC endpoints, not this serializer. The KYC
        fields below are read-only projections of the related DriverKyc row
        (see Driver.kyc) — kept here, flattened, so this endpoint's response
        shape doesn't change just because KYC moved to its own table.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
          description: The driver's full name. Required when you create a driver;
            up to 150 characters.
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
          description: The driver's mobile number in international format (`+919777700001`;
            10-15 digits, `+` optional). Required. This is what they sign in with,
            so it must be unique in your company.
        emergency_contact_name:
          type: string
          minLength: 1
          maxLength: 150
          description: Who to call if the driver needs help. **Required** when you
            create a driver (up to 150 characters).
        emergency_contact_phone:
          type: string
          minLength: 1
          maxLength: 20
          description: That person's number (up to 20 characters). **Required** when
            you create a driver.
    PatchedVehicleDocumentRequest:
      type: object
      properties:
        document_type:
          allOf:
          - $ref: '#/components/schemas/VehicleDocumentTypeEnum'
          description: 'What the document is: `insurance`, `fitness`, `rc` (registration
            certificate), `purchase` or `other`. Required.'
        file_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 200
          description: 'URL of the document''s file - upload it with `POST /uploads`
            (`purpose: vehicle_document`) or link one you host. Required.'
        expiry_date:
          type: string
          format: date
          nullable: true
          description: When the document expires (`YYYY-MM-DD`). **Required for `insurance`
            and `fitness`**, optional for the rest.
    PatchedVehicleRequest:
      type: object
      properties:
        vehicle_type_id:
          type: string
          format: uuid
          writeOnly: true
          description: The vehicle's type - the `id` of one of your **active** vehicle
            types. Required.
        registration_number:
          type: string
          minLength: 1
          maxLength: 20
          description: Registration plate. Required. Upper-cased for you; letters,
            digits and hyphens only (no spaces); unique among your vehicles, up to
            20 characters.
        capacity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Load capacity in kg (decimal, above 0). Optional - defaults
            to the vehicle type's `default_capacity_kg`.
        photo_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
          description: 'URL of a photo of the vehicle (upload with `purpose: vehicle_photo`).
            Optional.'
    PatchedVehicleTypeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Display name, e.g. `Bike` or `Tempo`. Required, unique within
            your company, up to 100 characters.
        category:
          allOf:
          - $ref: '#/components/schemas/VehicleCategoryEnum'
          description: 'The kind of vehicle: `two_wheeler`, `three_wheeler` or `four_wheeler`.
            It decides which routing profile is used (a bike takes shortcuts a truck
            can''t) and which driving licences may drive it.'
        default_capacity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Load capacity in kg given to a new vehicle of this type unless
            it overrides it. Required; must be above 0.
        icon_image_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
          description: 'URL of an icon for the type (upload one with `purpose: vehicle_type_icon`).
            Optional.'
        status:
          allOf:
          - $ref: '#/components/schemas/VehicleTypeStatusEnum'
          description: '`active` - can be booked and appears in estimates. `inactive`
            - hidden and not bookable (existing trips are unaffected). Default `active`.'
        base_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Flat starting charge in INR (decimal, 0 or more). Default `0.00`.
        per_km_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Charge per kilometre of route (decimal, 0 or more). Default
            `0.00`.
        per_min_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Charge per minute of estimated driving time (decimal, 0 or
            more). Default `0.00`.
        min_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: 'The least a trip on this type can cost. **Must be above 0**:
            `0` means "no fare card yet" and trips can''t be booked (`FARE_NOT_CONFIGURED`).'
    PaymentCollected:
      type: object
      properties:
        message:
          type: string
          description: Confirms the payment was recorded and to which number the delivery
            OTP went.
        otp:
          type: string
          description: The delivery OTP. **Only present on non-production servers**
            (`DRIVER_OTP_DEBUG_RESPONSE=True`); in production only the customer ever
            sees it.
      required:
      - message
    PaymentModeEnum:
      enum:
      - prepaid
      - cod
      type: string
      description: |-
        * `prepaid` - Prepaid
        * `cod` - Cash on Delivery
    PaymentQr:
      type: object
      properties:
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          description: |-
            Who made the code. `razorpay` in production; `upi_static` is the local-development stand-in.

            * `razorpay` - razorpay
            * `upi_static` - upi_static
        reference:
          type: string
          nullable: true
          description: The provider's id for this code (a Razorpay `qr_...`). Its
            webhook refers to the code by this id.
        image_url:
          type: string
          format: uri
          nullable: true
          description: A ready-made QR image hosted by Razorpay — display it as an
            image. `null` for `upi_static`.
        qr_payload:
          type: string
          nullable: true
          description: 'Only for `upi_static`: a UPI deep link (`upi://pay?...`) to
            draw as a QR yourself. `null` for `razorpay`.'
        amount:
          type: number
          format: double
          description: 'The amount to collect: the trip''s `total_fare`. The code
            is fixed to exactly this amount.'
        currency:
          type: string
          description: ISO currency code (`INR`).
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the code stops working. Asking again after this issues
            a fresh one. `null` for `upi_static`.
      required:
      - amount
      - currency
      - expires_at
      - image_url
      - provider
      - qr_payload
      - reference
    PaymentStatusEnum:
      enum:
      - pending
      - paid
      type: string
      description: |-
        * `pending` - Pending
        * `paid` - Paid
    PointRequest:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 255
          description: Street address as a person would write it. Shown to the driver.
            Up to 255 characters.
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          description: Latitude of the stop, decimal degrees, up to 6 decimal places.
            Must be inside the served area or routing fails (`ROUTING_UNAVAILABLE`).
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          description: Longitude of the stop, decimal degrees, up to 6 decimal places.
        contact_name:
          type: string
          maxLength: 150
          description: Who the driver should ask for at this stop. Optional.
        contact_phone:
          type: string
          maxLength: 20
          description: Phone number of that person (up to 20 characters, e.g. `+919888800002`).
            Optional for the pickup; **required for the drop of a cash-on-delivery
            trip**, because the delivery OTP is texted to it.
      required:
      - address
      - lat
      - lng
    PoliceSummary:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          description: |-
            The company's decision on this document.

            * `pending` - Pending
            * `verified` - Verified
            * `rejected` - Rejected
        submitted:
          type: boolean
          description: The driver has uploaded a certificate.
        document_url:
          type: string
          format: uri
          nullable: true
          description: Absolute URL of the uploaded certificate.
        rejection_note:
          type: string
          nullable: true
          description: Why the company rejected it (only while `status` is `rejected`).
      required:
      - document_url
      - rejection_note
      - status
      - submitted
    ProviderEnum:
      enum:
      - razorpay
      - upi_static
      type: string
      description: |-
        * `razorpay` - razorpay
        * `upi_static` - upi_static
    RazorpayEventRequest:
      type: object
      description: |-
        The parts of Razorpay's webhook body this API reads. Razorpay sends more
        (`account_id`, `created_at`, ...); it is ignored.
      properties:
        event:
          type: string
          minLength: 1
          description: The event name. Only `qr_code.credited` (a QR code received
            a payment) does anything; every other event is acknowledged and ignored.
        payload:
          type: object
          additionalProperties: {}
          description: Razorpay's event payload. This API reads `payload.qr_code.entity.id`
            (which trip's code was paid) and `payload.payment.entity.id` / `.amount`
            (the payment, in **paise**).
      required:
      - event
      - payload
    StatsPeriod:
      type: object
      properties:
        trips_completed:
          type: integer
          description: Trips finished in the period.
        trips_cancelled:
          type: integer
          description: Trips the driver cancelled in the period.
        total_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: What customers were charged for the completed trips.
        earnings:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: What the driver earned from them (their wallet credits).
        cod_collected:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Fare value of the completed cash-on-delivery trips.
        distance_meters:
          type: integer
          description: Route distance of the completed trips.
      required:
      - cod_collected
      - distance_meters
      - earnings
      - total_fare
      - trips_cancelled
      - trips_completed
    TargetEnum:
      enum:
      - pickup
      - drop
      type: string
      description: |-
        * `pickup` - pickup
        * `drop` - drop
    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The trip's id (UUID). Use it in every `/trips/{id}` call.
        status:
          allOf:
          - $ref: '#/components/schemas/TripStatusEnum'
          readOnly: true
          description: 'Where the trip is in its lifecycle: `requested`, `no_driver_available`,
            `assigned`, `arrived_at_pickup`, `in_progress`, `completed` or `cancelled`.
            See the Trip lifecycle guide.'
        reference_id:
          type: string
          readOnly: true
          description: Your own order number, exactly as you sent it (empty string
            if you sent none).
        vehicle_type:
          allOf:
          - $ref: '#/components/schemas/VehicleTypeSummary'
          readOnly: true
          description: The kind of vehicle booked.
        driver:
          allOf:
          - $ref: '#/components/schemas/TripDriverSummary'
          readOnly: true
          description: The assigned driver, or `null` until one is assigned (and after
            a `no_driver_available`).
        vehicle:
          allOf:
          - $ref: '#/components/schemas/TripVehicleSummary'
          readOnly: true
          description: The vehicle the driver is on, or `null` until a driver is assigned.
        pickup_address:
          type: string
          readOnly: true
          description: Pickup address, as sent.
        pickup_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          description: Pickup latitude, decimal string with 6 decimals.
        pickup_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          description: Pickup longitude, decimal string with 6 decimals.
        pickup_contact_name:
          type: string
          readOnly: true
          description: Contact at the pickup, or empty.
        pickup_contact_phone:
          type: string
          readOnly: true
          description: Phone of that contact, or empty.
        drop_address:
          type: string
          readOnly: true
          description: Drop address, as sent.
        drop_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          description: Drop latitude, decimal string with 6 decimals.
        drop_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          description: Drop longitude, decimal string with 6 decimals.
        drop_contact_name:
          type: string
          readOnly: true
          description: Contact at the drop, or empty.
        drop_contact_phone:
          type: string
          readOnly: true
          description: Phone of that contact - the delivery OTP goes here on cash-on-delivery
            trips.
        distance_meters:
          type: integer
          readOnly: true
          nullable: true
          description: Route length in metres, calculated when the trip was booked.
        duration_seconds:
          type: integer
          readOnly: true
          nullable: true
          description: Estimated driving time in seconds, calculated when the trip
            was booked.
        route_polyline:
          type: string
          readOnly: true
          description: The route as an encoded polyline. Decode it at `polyline_precision`
            (6 decimal places - not Google's 5) to draw the route on a map.
        polyline_precision:
          type: integer
          readOnly: true
          description: Decimal places `route_polyline` is encoded at. Always 6.
        base_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Flat starting fare, decimal string (e.g. `30.00`).
        distance_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Charge for the route's distance, decimal string.
        time_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Charge for the estimated driving time, decimal string.
        surge_multiplier:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          description: Demand multiplier applied to base + distance + time (currently
            always `1.00`).
        total_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: 'What the delivery costs: (base + distance + time) x surge,
            never below the vehicle type''s minimum fare. Decimal string. Fixed at
            booking - it does not change later.'
        currency:
          type: string
          readOnly: true
          description: ISO 4217 currency code. Always `INR`.
        payment_mode:
          allOf:
          - $ref: '#/components/schemas/PaymentModeEnum'
          readOnly: true
          description: '`prepaid` or `cod`, as sent.'
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
          description: '`pending` or `paid`. Prepaid trips are `paid` from the start;
            cash-on-delivery trips become `paid` once the customer''s Razorpay payment
            is confirmed.'
        cod_collected_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the cash-on-delivery payment was confirmed (ISO 8601,
            UTC), or `null`.
        payment_reference:
          type: string
          readOnly: true
          description: Razorpay's id for the payment that settled a cash-on-delivery
            trip (`pay_...`) - for reconciling against your Razorpay dashboard. Empty
            until paid.
        invoice_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Absolute URL of the invoice you supplied, or `null`.
        invoice_number:
          type: string
          readOnly: true
          description: The invoice number you supplied, or empty.
        verify_items:
          type: boolean
          readOnly: true
          description: Whether the driver must confirm every item before payment/completion.
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripItem'
          readOnly: true
          description: The goods, in the order you sent them, with the driver's per-item
            answers.
        cancellation_reason:
          type: string
          readOnly: true
          description: Why the trip was cancelled (empty unless `status` is `cancelled`).
        cancelled_by:
          oneOf:
          - $ref: '#/components/schemas/CancelledByEnum'
          - $ref: '#/components/schemas/BlankEnum'
          description: 'Who cancelled: `company`, `driver` or `system`; empty unless
            cancelled.'
          readOnly: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When a driver was assigned (ISO 8601, UTC), or `null`.
        arrived_at_pickup_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the driver reported arriving at the pickup, or `null`.
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the driver picked up the goods and started the delivery,
            or `null`.
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the delivery was completed, or `null`.
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the trip was cancelled, or `null`.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601, UTC).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601, UTC).
      required:
      - arrived_at_pickup_at
      - assigned_at
      - base_fare
      - cancellation_reason
      - cancelled_at
      - cancelled_by
      - cod_collected_at
      - completed_at
      - created_at
      - currency
      - distance_fare
      - distance_meters
      - driver
      - drop_address
      - drop_contact_name
      - drop_contact_phone
      - drop_lat
      - drop_lng
      - duration_seconds
      - id
      - invoice_number
      - invoice_url
      - items
      - payment_mode
      - payment_reference
      - payment_status
      - pickup_address
      - pickup_contact_name
      - pickup_contact_phone
      - pickup_lat
      - pickup_lng
      - polyline_precision
      - reference_id
      - route_polyline
      - started_at
      - status
      - surge_multiplier
      - time_fare
      - total_fare
      - updated_at
      - vehicle
      - vehicle_type
      - verify_items
    TripCancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          description: Why the trip is being cancelled (up to 255 characters). Required.
            The other party sees it.
      required:
      - reason
    TripCompleteRequest:
      type: object
      description: |-
        otp is only required for a COD trip — see TripService.driver_complete,
        which is where that's actually enforced (this only validates shape).
      properties:
        otp:
          type: string
          description: The 6-digit delivery OTP the customer was texted. **Required
            for a cash-on-delivery trip**, ignored for prepaid.
    TripCreateRequest:
      type: object
      properties:
        vehicle_type_id:
          type: string
          format: uuid
          description: 'Which kind of vehicle to book: the `vehicle_type_id` of one
            of the options returned by `POST /trips/estimate` (or an `id` from `GET
            /vehicle-types`). Must be an active vehicle type of your company.'
        pickup:
          allOf:
          - $ref: '#/components/schemas/PointRequest'
          description: Where the driver collects the goods.
        drop:
          allOf:
          - $ref: '#/components/schemas/PointRequest'
          description: Where the goods are delivered.
        payment_mode:
          allOf:
          - $ref: '#/components/schemas/PaymentModeEnum'
          description: '`prepaid` - already settled outside this system; the trip
            is marked paid immediately and the driver collects nothing. `cod` - cash
            on delivery: the driver collects the fare at the drop through a Razorpay
            QR code (see the Payments guide).'
        reference_id:
          type: string
          maxLength: 100
          description: Your own order number. Echoed back on the trip so you can match
            it to your records. Optional, up to 100 characters; it does not have to
            be unique.
        invoice_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 1000
          - type: string
            maxLength: 0
          description: Link to the invoice (PDF or image) for the goods - the driver's
            app offers it for download and sharing on WhatsApp. `http(s)` only. Host
            it yourself, or `POST /uploads` with `purpose=trip_invoice` and pass the
            URL it returns. Optional.
        invoice_number:
          type: string
          maxLength: 100
          description: The invoice's number as printed on it, shown next to the download
            button. Optional, up to 100 characters.
        verify_items:
          type: boolean
          default: false
          description: '`true` makes the driver confirm every item at the drop (delivered
            / not delivered, optionally with a photo) **before** the trip can be paid
            or completed; each answer is kept as delivery history. Requires at least
            one entry in `items`. Default `false`.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripItemInputRequest'
          description: The goods being delivered, one entry per line (at most 100).
            Optional; required if `verify_items` is `true`.
      required:
      - drop
      - payment_mode
      - pickup
      - vehicle_type_id
    TripDriverSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The driver's id (UUID).
        full_name:
          type: string
          maxLength: 150
          description: The driver's full name. Required when you create a driver;
            up to 150 characters.
        phone_number:
          type: string
          maxLength: 20
          description: The driver's mobile number in international format (`+919777700001`;
            10-15 digits, `+` optional). Required. This is what they sign in with,
            so it must be unique in your company.
      required:
      - id
      - phone_number
    TripEstimate:
      type: object
      properties:
        vehicle_type_id:
          type: string
          format: uuid
          description: Pass this as `vehicle_type_id` to `POST /trips` to book this
            option.
        vehicle_type_name:
          type: string
          description: Display name, e.g. `Bike`.
        category:
          type: string
          description: '`two_wheeler`, `three_wheeler` or `four_wheeler`.'
        icon_image_url:
          type: string
          format: uri
          nullable: true
          description: The vehicle type's icon, if the company set one.
        distance_meters:
          type: integer
          description: Route distance in metres.
        duration_seconds:
          type: integer
          description: Estimated driving time in seconds.
        route_polyline:
          type: string
          description: The route as an encoded polyline (precision given by `polyline_precision`).
        polyline_precision:
          type: integer
          description: Decimal places the polyline is encoded at (6 — not Google's
            5).
        base_fare:
          type: number
          format: double
          description: Flat starting fare.
        distance_fare:
          type: number
          format: double
          description: Per-km charge for this route.
        time_fare:
          type: number
          format: double
          description: Per-minute charge for this route.
        surge_multiplier:
          type: number
          format: double
          description: Demand multiplier applied to the sum of the three (currently
            always 1.0).
        total_fare:
          type: number
          format: double
          description: 'What the trip would cost: (base + distance + time) x surge,
            never less than the type''s minimum fare.'
        currency:
          type: string
          description: ISO currency code (`INR`).
      required:
      - base_fare
      - category
      - currency
      - distance_fare
      - distance_meters
      - duration_seconds
      - icon_image_url
      - polyline_precision
      - route_polyline
      - surge_multiplier
      - time_fare
      - total_fare
      - vehicle_type_id
      - vehicle_type_name
    TripEstimateRequestRequest:
      type: object
      properties:
        pickup:
          $ref: '#/components/schemas/PointRequest'
        drop:
          $ref: '#/components/schemas/PointRequest'
      required:
      - drop
      - pickup
    TripEstimates:
      type: object
      properties:
        estimates:
          type: array
          items:
            $ref: '#/components/schemas/TripEstimate'
          description: One entry per active vehicle type in the company's fleet.
      required:
      - estimates
    TripItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique id (UUID).
        position:
          type: integer
          readOnly: true
          description: The item's order in the list, starting at 0.
        name:
          type: string
          readOnly: true
          description: What the item is.
        quantity:
          type: integer
          readOnly: true
          description: How many were ordered.
        unit:
          type: string
          readOnly: true
          description: The unit of `quantity`, or empty.
        sku:
          type: string
          readOnly: true
          description: Your product code, or empty.
        notes:
          type: string
          readOnly: true
          description: Handling note you supplied, or empty.
        image_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Picture of the item you supplied, or `null`.
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Price per unit you supplied, as a decimal string, or `null`.
        status:
          allOf:
          - $ref: '#/components/schemas/ItemVerificationStatusEnum'
          readOnly: true
          description: 'The driver''s answer: `pending` (not yet checked), `delivered`,
            or `not_delivered`. Only moves off `pending` on orders with `verify_items`.'
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the driver answered (ISO 8601, UTC), or `null` while `pending`.
        proof_image_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: The photo the driver took when checking this item, or `null`
            if they took none. Kept as delivery proof.
        driver_note:
          type: string
          readOnly: true
          description: What the driver wrote - always present when `status` is `not_delivered`
            (what happened), otherwise usually empty.
      required:
      - driver_note
      - id
      - image_url
      - name
      - notes
      - position
      - proof_image_url
      - quantity
      - sku
      - status
      - unit
      - unit_price
      - verified_at
    TripItemInputRequest:
      type: object
      description: One line of the goods, as the company sends it when booking.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: What the item is, as the driver should see it (up to 200 characters).
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
          default: 1
          description: How many. Whole number from 1 to 1,000,000. Default `1`.
        unit:
          type: string
          maxLength: 30
          description: The unit of `quantity`, free text - `pcs`, `kg`, `box`, `bags`.
            Optional.
        sku:
          type: string
          maxLength: 100
          description: Your product code. Optional, up to 100 characters.
        notes:
          type: string
          maxLength: 255
          description: A handling note for the driver ("Keep dry", "Fragile"). Optional,
            up to 255 characters.
        image_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 1000
          - type: string
            maxLength: 0
          description: URL of a picture of the item so the driver can recognise it.
            `http(s)` only. Optional.
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Price per unit as a decimal (e.g. `380.00`), for the driver's
            information. Optional; it does not change the delivery fare.
      required:
      - name
    TripItemVerifyRequest:
      type: object
      description: |-
        POST /driver/trips/{id}/items/{item_id}/verify — multipart: `status`,
        optional `note` (required when the item was not delivered) and an optional
        `photo`.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/TripItemVerifyStatusEnum'
          description: 'The driver''s answer: `delivered` or `not_delivered`. Required.'
        note:
          type: string
          default: ''
          maxLength: 255
          description: What happened, up to 255 characters. **Required when `not_delivered`**;
            optional otherwise.
        photo:
          type: string
          format: binary
          description: A picture of the item, taken with the phone's camera as proof.
            Optional. Image, up to 10 MB. A new photo replaces the old one; none keeps
            it.
      required:
      - status
    TripItemVerifyStatusEnum:
      enum:
      - delivered
      - not_delivered
      type: string
      description: |-
        * `delivered` - delivered
        * `not_delivered` - not_delivered
    TripList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The trip's id (UUID). Use it in every `/trips/{id}` call.
        status:
          allOf:
          - $ref: '#/components/schemas/TripStatusEnum'
          readOnly: true
          description: 'Where the trip is in its lifecycle: `requested`, `no_driver_available`,
            `assigned`, `arrived_at_pickup`, `in_progress`, `completed` or `cancelled`.
            See the Trip lifecycle guide.'
        reference_id:
          type: string
          readOnly: true
          description: Your own order number, exactly as you sent it (empty string
            if you sent none).
        vehicle_type:
          allOf:
          - $ref: '#/components/schemas/VehicleTypeSummary'
          readOnly: true
          description: The kind of vehicle booked.
        driver:
          allOf:
          - $ref: '#/components/schemas/TripDriverSummary'
          readOnly: true
          description: The assigned driver, or `null` until one is assigned (and after
            a `no_driver_available`).
        vehicle:
          allOf:
          - $ref: '#/components/schemas/TripVehicleSummary'
          readOnly: true
          description: The vehicle the driver is on, or `null` until a driver is assigned.
        pickup_address:
          type: string
          readOnly: true
          description: Pickup address, as sent.
        drop_address:
          type: string
          readOnly: true
          description: Drop address, as sent.
        total_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: 'What the delivery costs: (base + distance + time) x surge,
            never below the vehicle type''s minimum fare. Decimal string. Fixed at
            booking - it does not change later.'
        currency:
          type: string
          readOnly: true
          description: ISO 4217 currency code. Always `INR`.
        payment_mode:
          allOf:
          - $ref: '#/components/schemas/PaymentModeEnum'
          readOnly: true
          description: '`prepaid` or `cod`, as sent.'
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
          description: '`pending` or `paid`. Prepaid trips are `paid` from the start;
            cash-on-delivery trips become `paid` once the customer''s Razorpay payment
            is confirmed.'
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601, UTC).
      required:
      - created_at
      - currency
      - driver
      - drop_address
      - id
      - payment_mode
      - payment_status
      - pickup_address
      - reference_id
      - status
      - total_fare
      - vehicle
      - vehicle_type
    TripStatusEnum:
      enum:
      - requested
      - no_driver_available
      - assigned
      - arrived_at_pickup
      - in_progress
      - completed
      - cancelled
      type: string
      description: |-
        * `requested` - Requested
        * `no_driver_available` - No Driver Available
        * `assigned` - Assigned
        * `arrived_at_pickup` - Arrived At Pickup
        * `in_progress` - In Progress
        * `completed` - Completed
        * `cancelled` - Cancelled
    TripVehicleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique id (UUID).
        registration_number:
          type: string
          maxLength: 20
          description: The vehicle's registration plate, e.g. `KA01AB1234`.
      required:
      - id
      - registration_number
    TypeEnum:
      enum:
      - credit
      - debit
      type: string
      description: |-
        * `credit` - credit
        * `debit` - debit
    UploadPurposeEnum:
      enum:
      - vehicle_type_icon
      - vehicle_photo
      - vehicle_document
      - driver_document
      - driver_photo
      - trip_invoice
      - trip_item_image
      - delivery_proof
      type: string
      description: |-
        * `vehicle_type_icon` - Vehicle Type Icon
        * `vehicle_photo` - Vehicle Photo
        * `vehicle_document` - Vehicle Document
        * `driver_document` - Driver Document
        * `driver_photo` - Driver Photo
        * `trip_invoice` - Trip Invoice
        * `trip_item_image` - Trip Item Image
        * `delivery_proof` - Delivery Proof Photo
    UploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The file to store. Images (`jpg`, `jpeg`, `png`, `webp`) for
            every purpose; PDF is also accepted for `vehicle_document`, `driver_document`
            and `trip_invoice`. Maximum size is `MAX_UPLOAD_SIZE_MB` (10 MB by default).
            The content is checked — a renamed text file is rejected.
        purpose:
          allOf:
          - $ref: '#/components/schemas/UploadPurposeEnum'
          description: |-
            What the file is for. It decides where the file is stored and which types are accepted.

            * `vehicle_type_icon` - Vehicle Type Icon
            * `vehicle_photo` - Vehicle Photo
            * `vehicle_document` - Vehicle Document
            * `driver_document` - Driver Document
            * `driver_photo` - Driver Photo
            * `trip_invoice` - Trip Invoice
            * `trip_item_image` - Trip Item Image
            * `delivery_proof` - Delivery Proof Photo
      required:
      - file
      - purpose
    UploadResult:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Absolute URL of the stored file. Pass it, unchanged, to whichever
            request needs a file URL (`invoice_url`, an item's `image_url`, a vehicle's
            `photo_url`, ...).
      required:
      - url
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique id (UUID).
        registration_number:
          type: string
          maxLength: 20
          description: Registration plate. Required. Upper-cased for you; letters,
            digits and hyphens only (no spaces); unique among your vehicles, up to
            20 characters.
        capacity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Load capacity in kg (decimal, above 0). Optional - defaults
            to the vehicle type's `default_capacity_kg`.
        photo_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
          description: 'URL of a photo of the vehicle (upload with `purpose: vehicle_photo`).
            Optional.'
        status:
          allOf:
          - $ref: '#/components/schemas/VehicleStatusEnum'
          readOnly: true
          description: '`active`, `maintenance` or `disabled`. Set by the system -
            `POST /vehicles/{id}/disable` retires a vehicle.'
        current_driver_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The driver last put on this vehicle by going on duty (a driver
            id), or `null`. Maintained by the system; read-only.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601, UTC).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601, UTC).
      required:
      - created_at
      - current_driver_id
      - id
      - registration_number
      - status
      - updated_at
    VehicleCategoryEnum:
      enum:
      - two_wheeler
      - three_wheeler
      - four_wheeler
      type: string
      description: |-
        * `two_wheeler` - 2 Wheeler
        * `three_wheeler` - 3 Wheeler
        * `four_wheeler` - 4 Wheeler
    VehicleDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique id (UUID).
        vehicle_type:
          allOf:
          - $ref: '#/components/schemas/VehicleTypeSummary'
          readOnly: true
          description: The vehicle's type (name, category, icon).
        registration_number:
          type: string
          maxLength: 20
          description: Registration plate. Required. Upper-cased for you; letters,
            digits and hyphens only (no spaces); unique among your vehicles, up to
            20 characters.
        capacity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
