  /drivers/{id}/wallet/transactions:
    post:
      operationId: recordWalletEntry
      description: |-
        Appends one entry to the driver's ledger and returns it with the new running `balance_after`.

        Send `amount` as a **positive** number for `payout`, `bonus` and `penalty` - the server applies the sign (a payout and a penalty
        subtract, a bonus adds). Only `adjustment` takes the sign you send (positive adds, negative subtracts). No amount may be zero.

        A payout larger than the driver's current balance is refused with `INSUFFICIENT_BALANCE`. Use `reference` for your bank/UTR
        reference so the driver and you can match it later.

        **Who may call this:** **Admin** - an admin token only (not an API client).

        **Admin token only.** These endpoints manage people, so an API-client token is refused with `PERMISSION_DENIED`. Sign in as an
        admin with `POST /auth/login`.

        **How the wallet works.** Every completed trip credits the driver a share of the fare (`DRIVER_EARNING_PERCENT`, 80% by default) automatically.
        The company pays drivers **outside this system** (bank/UPI) and then records it here as a `payout`, which lowers the balance. You can
        also record a `bonus` (adds), a `penalty` (subtracts) or an `adjustment` (a correction, either sign). The ledger is append-only: a
        mistake is fixed with another entry, never by editing history.
      summary: Record a payout, bonus, penalty or adjustment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: The driver's id (UUID).
        required: true
      tags:
      - Driver wallets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletEntryCreateRequest'
            examples:
              AWeeklyPayout:
                value:
                  kind: payout
                  amount: '50.00'
                  description: Weekly payout
                  reference: UTR-4820193
                summary: A weekly payout
              ABonus:
                value:
                  kind: bonus
                  amount: '100.00'
                  description: Festival bonus
                summary: A bonus
              ACorrectionNegative:
                value:
                  kind: adjustment
                  amount: '-25.00'
                  description: Duplicate credit reversed
                summary: A correction (negative)
        required: true
      security:
      - AdminToken: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALIDAMOUNT:
                  value:
                    success: false
                    error:
                      code: INVALID_AMOUNT
                      message: Enter a positive amount.
                  summary: INVALID_AMOUNT
                INVALIDKIND:
                  value:
                    success: false
                    error:
                      code: INVALID_KIND
                      message: Trip earnings are credited automatically.
                  summary: INVALID_KIND
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: |-
            One of:
            - `INVALID_AMOUNT` - A wallet entry's amount is zero, or isn't positive for a payout, bonus or penalty (the server applies the sign for those kinds).
            - `INVALID_KIND` - A trip-earning entry was posted by hand. Earnings are credited automatically when a trip completes. (The request schema doesn't allow `trip_earning`, so an ordinary client gets `INVALID` first.)
            - `INVALID` - The request body, query string or form is missing a required field or has a value that isn't acceptable. `details` names every offending field.
        '401':
