  /trips/{id}/cancel:
    post:
      operationId: cancelTrip
      description: |-
        Cancels a trip, recording your `reason`. The assigned driver (if any) sees it disappear from their app.

        A trip can be cancelled **until the driver has started the delivery** - in the statuses `requested`,
        `no_driver_available`, `assigned` and `arrived_at_pickup`. Once it is `in_progress`, `completed` or already
        `cancelled`, the call is refused with `TRIP_NOT_CANCELLABLE`.

        **Who may call this:** **Company** - an API client token *or* an admin token.
      summary: Cancel a trip
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: The trip's id (UUID) - the `id` returned when it was booked.
        required: true
      tags:
      - Trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCancelRequest'
            examples:
              CustomerChangedTheirMind:
                value:
                  reason: Customer cancelled the order
                summary: Customer changed their mind
        required: true
      security:
      - ApiClientToken: []
      - AdminToken: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: '`INVALID` - The request body, query string or form is missing
            a required field or has a value that isn''t acceptable. `details` names
            every offending field.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
