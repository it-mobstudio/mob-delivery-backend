    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: A stable, machine-readable code (`TRIP_NOT_CANCELLABLE`). Branch
            on this, never on `message`. All codes are listed in the **Errors** guide.
        message:
          type: string
          description: A sentence for people. Safe to show to a user, but it may be
            reworded - don't match on it.
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Only for `INVALID`: `{field_name: [problem, ...]}` - one entry
            per offending field. Nested objects appear under their own field name.'
      required:
      - code
      - message
    ItemVerificationStatusEnum:
      enum:
      - pending
      - delivered
      - not_delivered
      type: string
      description: |-
        * `pending` - Pending
        * `delivered` - Delivered
        * `not_delivered` - Not delivered
    KycDecisionEnum:
      enum:
      - verified
      - rejected
      type: string
      description: |-
        * `verified` - verified
        * `rejected` - rejected
    LicenceSummary:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          description: |-
            The company's decision on this document.

            * `pending` - Pending
            * `verified` - Verified
            * `rejected` - Rejected
        submitted:
          type: boolean
          description: The driver has uploaded something for it.
        number:
          type: string
          nullable: true
          description: Licence number as submitted (tidied and upper-cased).
        expiry_date:
          type: string
          format: date
          nullable: true
          description: Expiry date. The driver's own claim until the company verifies
            it, then the company's.
        front_url:
          type: string
          format: uri
          nullable: true
          description: Absolute URL of the front scan.
        back_url:
          type: string
          format: uri
          nullable: true
          description: Absolute URL of the back scan (optional to upload).
        rejection_note:
          type: string
          nullable: true
          description: Why the company rejected it (only while `status` is `rejected`).
      required:
      - back_url
      - expiry_date
      - front_url
      - number
      - rejection_note
      - status
      - submitted
    Message:
      type: object
      properties:
        message:
          type: string
          description: A short human-readable confirmation.
      required:
      - message
    NavigationRoute:
      type: object
      properties:
        target:
          allOf:
          - $ref: '#/components/schemas/TargetEnum'
          description: |-
            The stop this route leads to: the pickup until the driver has picked up, the drop after.

            * `pickup` - pickup
            * `drop` - drop
        target_lat:
          type: number
          format: double
          description: Latitude of that stop.
        target_lng:
          type: number
          format: double
          description: Longitude of that stop.
        polyline:
          type: string
          description: Route from the driver's position to the stop, encoded at `polyline_precision`.
        polyline_precision:
          type: integer
          description: Decimal places the polyline is encoded at (6).
        distance_meters:
          type: integer
          description: Remaining distance in metres.
        duration_seconds:
          type: integer
          description: Estimated remaining driving time in seconds.
      required:
      - distance_meters
      - duration_seconds
      - polyline
      - polyline_precision
      - target
      - target_lat
      - target_lng
