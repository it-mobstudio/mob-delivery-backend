    delete:
      operationId: driverDeleteAccount
      description: |-
        Closes the driver's own account (an app-store requirement for apps that let people sign themselves up). The account is disabled and
        signed out everywhere; trips and wallet history are kept for the company's records.

        Refused while it would strand something: an **active trip** (`DRIVER_HAS_ACTIVE_TRIP`) or **money the company still owes them**
        (`WALLET_BALANCE_PENDING` - the message says how much).

        **Who may call this:** **Driver** - a driver token only.
      summary: Delete my account
      tags:
      - Driver profile & onboarding
      security:
      - DriverToken: []
      responses:
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTAUTHENTICATED:
                  value:
                    success: false
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                  summary: NOT_AUTHENTICATED
                TOKENNOTVALID:
                  value:
                    success: false
                    error:
                      code: TOKEN_NOT_VALID
                      message: Given token not valid for any token type
                  summary: TOKEN_NOT_VALID
          description: |-
            One of:
            - `NOT_AUTHENTICATED` - No `Authorization` header was sent.
            - `TOKEN_NOT_VALID` - The bearer token is expired, malformed, or was signed by another environment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PERMISSIONDENIED:
                  value:
                    success: false
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                  summary: PERMISSION_DENIED
          description: '`PERMISSION_DENIED` - You are signed in, but this kind of
            token may not use this endpoint (e.g. a driver token on a company endpoint,
            or the reverse).'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DRIVERHASACTIVETRIP:
                  value:
                    success: false
                    error:
                      code: DRIVER_HAS_ACTIVE_TRIP
                      message: Finish or cancel your active trip before deleting your
                        account.
                  summary: DRIVER_HAS_ACTIVE_TRIP
                WALLETBALANCEPENDING:
                  value:
                    success: false
                    error:
                      code: WALLET_BALANCE_PENDING
                      message: You still have ₹18.00 in your wallet. Ask your company
