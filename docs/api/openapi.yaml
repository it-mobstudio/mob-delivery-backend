openapi: 3.0.3
info:
  title: MOB Delivery API
  version: 1.0.0
  description: |-
    Book deliveries, follow them live, and run the driver app - one REST API for companies (server-to-server or admin panel) and for the drivers' mobile app.

    **New here?** Read *Introduction* and *Authentication* in the menu, then follow *Booking a delivery*. Every endpoint below lists who may call it, which fields are required, real request/response examples and every error it can return.

    On a running server: `/api/docs/` is the interactive console (try calls), `/api/redoc/` is this reference, and `/api/schema/` is the machine-readable OpenAPI file.
paths:
  /auth/client-token:
    post:
      operationId: createClientToken
      description: |-
        Exchange your **client id and client secret** for a short-lived access token. This is how a
        company's *backend* signs in (OAuth "client credentials" style): call it from your server,
        keep the token in memory, and send it on every other call as `Authorization: Bearer <access>`.

        The client id and secret are issued when your API client is created; **the secret is shown only
        once**, so store it like a password and never put it in a browser or mobile app.

        The token is valid for `expires_in` seconds (3600 = 60 minutes). There is no refresh token: when it
        expires - or when any call returns `401 TOKEN_NOT_VALID` - simply call this endpoint again.

        **Who may call this:** **No token needed.**
      summary: Get an access token (API client)
      tags:
      - Company authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiClientTokenRequestRequest'
            examples:
              YourCredentials:
                value:
                  client_id: 0b1c3a52-6f0e-4d3e-9a55-1f2b7c9d4e10
                  client_secret: sk_live_...
                summary: Your credentials
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: '`INVALID` - The request body, query string or form is missing
            a required field or has a value that isn''t acceptable. `details` names
            every offending field.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AUTHENTICATIONFAILED:
                  value:
                    success: false
                    error:
                      code: AUTHENTICATION_FAILED
                      message: Invalid client credentials.
                  summary: AUTHENTICATION_FAILED
          description: '`AUTHENTICATION_FAILED` - Wrong credentials (client id/secret,
            email/password), or the account behind a valid token is inactive.'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiClientToken'
              examples:
                TokenIssued:
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXBlIjoiYXBpX2NsaWVudCIsImV4cCI6MTc5MDAwMDAwMH0.w5Tn7cM2kE8-example-access-signature
                    expires_in: 3600
                  summary: Token issued
          description: Success.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "$BASE_URL/auth/client-token" \
            -H "Content-Type: application/json" \
            -d '{
              "client_id": "0b1c3a52-6f0e-4d3e-9a55-1f2b7c9d4e10",
              "client_secret": "sk_live_..."
            }'
      - lang: Python
        label: Python
        source: |-
          import requests

          BASE_URL = "http://localhost:8000/api/v1"

          response = requests.post(
              f"{BASE_URL}/auth/client-token",
              json={
                  "client_id": "0b1c3a52-6f0e-4d3e-9a55-1f2b7c9d4e10",
                  "client_secret": "sk_live_..."
              },
          )
          print(response.status_code, response.json())
      - lang: JavaScript
        label: JavaScript
        source: |-
          const BASE_URL = "http://localhost:8000/api/v1";

          const response = await fetch(`${BASE_URL}/auth/client-token`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              "client_id": "0b1c3a52-6f0e-4d3e-9a55-1f2b7c9d4e10",
              "client_secret": "sk_live_..."
            }),
          });
          console.log(response.status, await response.json());
  /auth/login:
    post:
      operationId: adminLogin
      description: |-
        Email + password sign-in for a company **admin user** (the people who use the company's admin
        panel). Returns a short-lived `access` token and a long-lived `refresh` token.

        Send `access` as `Authorization: Bearer <access>`. When it expires, trade the `refresh` token for a new
        one at `POST /auth/refresh` instead of asking for the password again.

        Integrations that run without a person should use an API client
        (`POST /auth/client-token`) rather than an admin's password.

        **Who may call this:** **No token needed.**
      summary: Sign in (admin panel)
      tags:
      - Company authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequestRequest'
            examples:
              AdminCredentials:
                value:
                  email: ops@yourcompany.com
                  password: correct horse battery
                summary: Admin credentials
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: '`INVALID` - The request body, query string or form is missing
            a required field or has a value that isn''t acceptable. `details` names
            every offending field.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AUTHENTICATIONFAILED:
                  value:
                    success: false
                    error:
                      code: AUTHENTICATION_FAILED
                      message: Invalid client credentials.
                  summary: AUTHENTICATION_FAILED
          description: '`AUTHENTICATION_FAILED` - Wrong credentials (client id/secret,
            email/password), or the account behind a valid token is inactive.'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTokenPair'
              examples:
                SignedIn:
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXBlIjoiYWRtaW4iLCJleHAiOjE3OTAwMDAwMDB9.b2Hs6dQ8yC4-example-access-signature
                    refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXBlIjoiYWRtaW4iLCJleHAiOjE3OTA2MDQ4MDB9.z9Lf3uP5tR1-example-refresh-signature
                  summary: Signed in
          description: Success.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "$BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            -d '{
              "email": "ops@yourcompany.com",
              "password": "correct horse battery"
            }'
      - lang: Python
        label: Python
        source: |-
          import requests

          BASE_URL = "http://localhost:8000/api/v1"

          response = requests.post(
              f"{BASE_URL}/auth/login",
              json={
                  "email": "ops@yourcompany.com",
                  "password": "correct horse battery"
              },
          )
          print(response.status_code, response.json())
      - lang: JavaScript
        label: JavaScript
        source: |-
          const BASE_URL = "http://localhost:8000/api/v1";

          const response = await fetch(`${BASE_URL}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              "email": "ops@yourcompany.com",
              "password": "correct horse battery"
            }),
          });
          console.log(response.status, await response.json());
  /auth/refresh:
    post:
      operationId: refreshAdminToken
      description: |-
        Trade the `refresh` token from `POST /auth/login` for a fresh `access` token.
        The refresh token itself stays valid until it expires (7 days by default), so keep it and reuse it.

        If the refresh token has expired, the admin has to sign in again.

        **Who may call this:** **No token needed.**
      summary: Renew an admin access token
      tags:
      - Company authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTokenRefreshRequestRequest'
            examples:
              Refresh:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                summary: Refresh
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: '`INVALID` - The request body, query string or form is missing
            a required field or has a value that isn''t acceptable. `details` names
            every offending field.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TOKENNOTVALID:
                  value:
                    success: false
                    error:
                      code: TOKEN_NOT_VALID
                      message: Given token not valid for any token type
                  summary: TOKEN_NOT_VALID
          description: '`TOKEN_NOT_VALID` - The bearer token is expired, malformed,
            or was signed by another environment.'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccessToken'
              examples:
                NewAccessToken:
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXBlIjoiYWRtaW4iLCJleHAiOjE3OTAwMDAwMDB9.b2Hs6dQ8yC4-example-access-signature
                  summary: New access token
          description: Success.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "$BASE_URL/auth/refresh" \
            -H "Content-Type: application/json" \
            -d '{
              "refresh": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            }'
      - lang: Python
        label: Python
        source: |-
          import requests

          BASE_URL = "http://localhost:8000/api/v1"

          response = requests.post(
              f"{BASE_URL}/auth/refresh",
              json={
                  "refresh": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              },
          )
          print(response.status_code, response.json())
      - lang: JavaScript
        label: JavaScript
        source: |-
          const BASE_URL = "http://localhost:8000/api/v1";

          const response = await fetch(`${BASE_URL}/auth/refresh`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              "refresh": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            }),
          });
          console.log(response.status, await response.json());
  /driver/auth/logout:
    post:
      operationId: driverSignOut
      description: |-
        Revokes the refresh token so this session can't be revived from this device - or from a copy of the token. Discard both tokens locally.
        The short-lived access token simply runs out (60 minutes). Signing out with an already-invalid token still succeeds.

        **Who may call this:** **No token needed.**
      summary: Sign out
      tags:
      - Driver sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverTokenRefreshRequest'
            examples:
              TheRefreshTokenToRevoke:
                value:
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                summary: The refresh token to revoke
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: '`INVALID` - The request body, query string or form is missing
            a required field or has a value that isn''t acceptable. `details` names
            every offending field.'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                SignedOut:
                  value:
                    message: Signed out.
                  summary: Signed out
          description: Success.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "$BASE_URL/driver/auth/logout" \
            -H "Content-Type: application/json" \
            -d '{
              "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            }'
      - lang: Python
        label: Python
        source: |-
          import requests

          BASE_URL = "http://localhost:8000/api/v1"

          response = requests.post(
              f"{BASE_URL}/driver/auth/logout",
              json={
                  "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              },
          )
          print(response.status_code, response.json())
      - lang: JavaScript
        label: JavaScript
        source: |-
          const BASE_URL = "http://localhost:8000/api/v1";

          const response = await fetch(`${BASE_URL}/driver/auth/logout`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            }),
          });
          console.log(response.status, await response.json());
  /driver/auth/otp/request:
    post:
      operationId: driverRequestOtp
      description: |-
        **Step 1 of signing a driver in.** Sends a 6-digit one-time code by SMS to `phone_number`. It is valid for **5 minutes**.

        The answer is the same whether or not the number belongs to a driver yet, so this endpoint never reveals who is registered. When the
        server allows **self sign-up**, a number nobody has registered also gets a code - and becomes a new, empty driver account once
        the code is verified (see *Driver onboarding & wallet*). When sign-up is closed, only numbers the company registered get a code
        (`DRIVER_NOT_FOUND` otherwise).

        On a **non-production server** the response also contains the code in `otp` so the flow can be tested without an SMS gateway. A
        production server never returns it.

        **Who may call this:** **No token needed.**
      summary: Send a sign-in code by SMS
      tags:
      - Driver sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverOtpRequestRequest'
            examples:
              SendACode:
                value:
                  phone_number: '+919000000001'
                summary: Send a code
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: '`INVALID` - The request body, query string or form is missing
            a required field or has a value that isn''t acceptable. `details` names
            every offending field.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCOUNTDISABLED:
                  value:
                    success: false
                    error:
                      code: ACCOUNT_DISABLED
                      message: This driver's account has been disabled.
                  summary: ACCOUNT_DISABLED
                ACCOUNTLOCKED:
                  value:
                    success: false
                    error:
                      code: ACCOUNT_LOCKED
                      message: This driver's account is locked because their driving
                        licence has expired.
                  summary: ACCOUNT_LOCKED
          description: |-
            One of:
            - `ACCOUNT_DISABLED` - The company has disabled this driver.
            - `ACCOUNT_LOCKED` - The driver's account is locked because their driving licence has expired.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DRIVERNOTFOUND:
                  value:
                    success: false
                    error:
                      code: DRIVER_NOT_FOUND
                      message: No driver found with this phone number. Ask your company
                        to register you.
                  summary: DRIVER_NOT_FOUND
          description: '`DRIVER_NOT_FOUND` - Sign-up is closed on this server and
            no driver is registered with this phone number. (When sign-up is open,
            an unknown number simply becomes a new driver.)'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DRIVERPHONEAMBIGUOUS:
                  value:
                    success: false
                    error:
                      code: DRIVER_PHONE_AMBIGUOUS
                      message: This phone number matches drivers in more than one
                        company.
                  summary: DRIVER_PHONE_AMBIGUOUS
          description: '`DRIVER_PHONE_AMBIGUOUS` - The same phone number belongs to
            drivers in more than one company, so the login can''t tell which one to
            use.'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverOtpRequestResult'
              examples:
                CodeSentTestServerShowsTheCode:
                  value:
                    message: OTP sent to +919876543210.
                    otp: '482913'
                  summary: Code sent (test server shows the code)
          description: Success.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "$BASE_URL/driver/auth/otp/request" \
            -H "Content-Type: application/json" \
            -d '{
              "phone_number": "+919000000001"
            }'
      - lang: Python
        label: Python
        source: |-
          import requests

          BASE_URL = "http://localhost:8000/api/v1"

          response = requests.post(
              f"{BASE_URL}/driver/auth/otp/request",
              json={
                  "phone_number": "+919000000001"
              },
          )
          print(response.status_code, response.json())
      - lang: JavaScript
        label: JavaScript
        source: |-
          const BASE_URL = "http://localhost:8000/api/v1";

          const response = await fetch(`${BASE_URL}/driver/auth/otp/request`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              "phone_number": "+919000000001"
            }),
          });
          console.log(response.status, await response.json());
  /driver/auth/otp/verify:
    post:
      operationId: driverVerifyOtp
      description: |-
        **Step 2.** Trade the SMS code for a session: an `accessToken` (60 minutes), a `refreshToken` (30 days) and the driver's profile, so the
        app can decide what to show first (`driver.onboarding_status` tells it whether to run onboarding).

        Send the access token on every driver call as `Authorization: Bearer <accessToken>`. Before it expires, renew the pair with
        `POST /driver/auth/refresh`; when the refresh token finally lapses, the driver signs in with a new SMS code.

        A wrong or expired code is `INVALID_OTP`; the code is single-use.

        **Who may call this:** **No token needed.**
      summary: Sign in with the code
      tags:
      - Driver sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverOtpVerifyRequest'
            examples:
              PhoneAndTheCodeFromTheSms:
                value:
                  phone_number: '+919000000001'
                  otp: '482913'
                summary: Phone and the code from the SMS
        required: true
      security:
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALIDOTP:
                  value:
                    success: false
                    error:
                      code: INVALID_OTP
                      message: The OTP is invalid or has expired.
                  summary: INVALID_OTP
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: |-
            One of:
            - `INVALID_OTP` - The login OTP is wrong or has expired (OTPs last 5 minutes).
            - `INVALID` - The request body, query string or form is missing a required field or has a value that isn't acceptable. `details` names every offending field.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCOUNTDISABLED:
                  value:
                    success: false
                    error:
                      code: ACCOUNT_DISABLED
                      message: This driver's account has been disabled.
                  summary: ACCOUNT_DISABLED
                ACCOUNTLOCKED:
                  value:
                    success: false
                    error:
                      code: ACCOUNT_LOCKED
                      message: This driver's account is locked because their driving
                        licence has expired.
                  summary: ACCOUNT_LOCKED
          description: |-
            One of:
            - `ACCOUNT_DISABLED` - The company has disabled this driver.
            - `ACCOUNT_LOCKED` - The driver's account is locked because their driving licence has expired.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DRIVERNOTFOUND:
                  value:
                    success: false
                    error:
                      code: DRIVER_NOT_FOUND
                      message: No driver found with this phone number. Ask your company
                        to register you.
                  summary: DRIVER_NOT_FOUND
          description: '`DRIVER_NOT_FOUND` - Sign-up is closed on this server and
            no driver is registered with this phone number. (When sign-up is open,
            an unknown number simply becomes a new driver.)'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DRIVERPHONEAMBIGUOUS:
                  value:
                    success: false
                    error:
                      code: DRIVER_PHONE_AMBIGUOUS
                      message: This phone number matches drivers in more than one
                        company.
                  summary: DRIVER_PHONE_AMBIGUOUS
          description: '`DRIVER_PHONE_AMBIGUOUS` - The same phone number belongs to
            drivers in more than one company, so the login can''t tell which one to
            use.'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverSession'
              examples:
                SignedIn:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXBlIjoiZHJpdmVyIiwiZXhwIjoxNzkwMDAwMDAwfQ.q3vN8rT1xZ2-example-access-signature
                    driver:
                      aadhar_rejection_note: null
                      aadhar_status: pending
                      account_status: active
                      address_line: ''
                      city: ''
                      current_vehicle: null
                      current_vehicle_id: null
                      date_of_birth: null
                      dl_allowed_categories: []
                      dl_expiry_date: null
                      dl_rejection_note: null
                      dl_status: pending
                      email: ''
                      emergency_contact_name: ''
                      emergency_contact_phone: ''
                      full_name: ''
                      id: bd316e30-cfde-4314-829e-3822e0c049bc
                      is_eligible_for_assignment: false
                      is_online: false
                      is_profile_complete: false
                      kyc:
                        aadhar:
                          back_url: null
                          front_url: null
                          number_last4: null
                          rejection_note: null
                          status: pending
                          submitted: false
                        dl:
                          back_url: null
                          expiry_date: null
                          front_url: null
                          number: null
                          rejection_note: null
                          status: pending
                          submitted: false
                        police:
                          document_url: null
                          rejection_note: null
                          status: pending
                          submitted: false
                      onboarding_status: profile_incomplete
                      payout:
                        bank_account_holder: null
                        bank_account_last4: null
                        bank_ifsc: null
                        is_set: false
                        upi_id: null
                      phone_number: '+919876543210'
                      pincode: ''
                      police_rejection_note: null
                      police_status: pending
                      profile_photo_url: null
                    driverName: ''
                    expiresInSeconds: 3600
                    refreshExpiresInSeconds: 2592000
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXBlIjoiZHJpdmVyIiwiZXhwIjoxNzkyNTkyMDAwfQ.m7Kp4sL9wA6-example-refresh-signature
                    tokenType: Bearer
                  summary: Signed in
          description: Success.
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "$BASE_URL/driver/auth/otp/verify" \
