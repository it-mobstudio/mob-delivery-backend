                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: '`INVALID` - The request body, query string or form is missing
            a required field or has a value that isn''t acceptable. `details` names
            every offending field.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTAUTHENTICATED:
                  value:
                    success: false
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                  summary: NOT_AUTHENTICATED
