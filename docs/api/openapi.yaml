  /driver/me/kyc/dl:
    post:
      operationId: driverSubmitLicence
      description: |-
        Sends the licence number, its expiry date (must be in the future) and a scan of the front (the back is optional). The company confirms the expiry
        and which vehicle categories it covers when it verifies - that decides which vehicles the driver may take on duty. Locked once verified.

        **Who may call this:** **Driver** - a driver token only.

        Send as **`multipart/form-data`** (not JSON). Images only (`jpg`, `jpeg`, `png`, `webp`) unless noted, up to 10 MB each; the content is
        checked, so a renamed text file is refused with `INVALID_UPLOAD`. The response is the refreshed profile, so the app updates in one round trip.
      summary: Submit my driving licence
      tags:
      - Driver profile & onboarding
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverDlSubmitRequest'
        required: true
      security:
      - DriverToken: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALIDUPLOAD:
                  value:
                    success: false
                    error:
                      code: INVALID_UPLOAD
                      message: 'Unsupported file type ''.pdf'' for purpose ''vehicle_photo''.
                        Allowed: [''jpeg'', ''jpg'', ''png'', ''webp''].'
                  summary: INVALID_UPLOAD
                INVALID:
                  value:
                    success: false
                    error:
                      code: INVALID
                      message: Request could not be processed.
                      details:
                        field:
                        - This field is required.
                  summary: INVALID
          description: |-
            One of:
            - `INVALID_UPLOAD` - The file isn't an acceptable image/PDF (wrong type, too large, or corrupt).
            - `INVALID` - The request body, query string or form is missing a required field or has a value that isn't acceptable. `details` names every offending field.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOTAUTHENTICATED:
                  value:
                    success: false
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                  summary: NOT_AUTHENTICATED
                TOKENNOTVALID:
                  value:
                    success: false
                    error:
                      code: TOKEN_NOT_VALID
                      message: Given token not valid for any token type
                  summary: TOKEN_NOT_VALID
          description: |-
            One of:
            - `NOT_AUTHENTICATED` - No `Authorization` header was sent.
            - `TOKEN_NOT_VALID` - The bearer token is expired, malformed, or was signed by another environment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PERMISSIONDENIED:
                  value:
                    success: false
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                  summary: PERMISSION_DENIED
          description: '`PERMISSION_DENIED` - You are signed in, but this kind of
            token may not use this endpoint (e.g. a driver token on a company endpoint,
            or the reverse).'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                KYCALREADYVERIFIED:
                  value:
                    success: false
                    error:
                      code: KYC_ALREADY_VERIFIED
                      message: Your driving licence is already verified. Contact support
                        if it needs to change.
                  summary: KYC_ALREADY_VERIFIED
          description: '`KYC_ALREADY_VERIFIED` - The driver tried to re-submit a document
