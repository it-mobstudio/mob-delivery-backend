          console.log(response.status, await response.json());
components:
  schemas:
    AadharSummary:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          description: |-
            The company's decision on this document.

            * `pending` - Pending
            * `verified` - Verified
            * `rejected` - Rejected
        submitted:
          type: boolean
          description: The driver has uploaded something for it.
        number_last4:
          type: string
          nullable: true
          description: Last four digits of the Aadhaar number — the only part that
            is stored.
        front_url:
          type: string
          format: uri
          nullable: true
          description: Absolute URL of the front scan.
        back_url:
          type: string
          format: uri
          nullable: true
          description: Absolute URL of the back scan.
        rejection_note:
          type: string
          nullable: true
          description: Why the company rejected it (only while `status` is `rejected`).
      required:
      - back_url
      - front_url
      - number_last4
      - rejection_note
      - status
      - submitted
    ActiveTrip:
      type: object
      properties:
        trip:
          allOf:
          - $ref: '#/components/schemas/DriverTrip'
          nullable: true
          description: The trip the driver is on (assigned, at pickup or in progress),
            or `null` when there isn't one.
      required:
      - trip
    AdminAccessToken:
      type: object
      properties:
        access:
          type: string
          description: A new short-lived access token.
      required:
      - access
    AdminLoginRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: The admin user's email address.
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: The admin user's password.
      required:
      - email
      - password
    AdminTokenPair:
      type: object
      properties:
        access:
          type: string
          description: 'Short-lived JWT (`ACCESS_TOKEN_LIFETIME_MINUTES`, 60 by default).
            Send it as `Authorization: Bearer <access>`.'
        refresh:
          type: string
          description: Long-lived JWT (`REFRESH_TOKEN_LIFETIME_DAYS`, 7 by default).
            Exchange it at `POST /auth/refresh` for a new access token.
      required:
      - access
      - refresh
    AdminTokenRefreshRequestRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          description: The `refresh` token from `POST /auth/login`.
      required:
      - refresh
    ApiClientToken:
      type: object
      properties:
        access:
          type: string
          description: 'Short-lived JWT. Send it as `Authorization: Bearer <access>`.'
        expires_in:
          type: integer
          description: 'Seconds until the token expires (`API_CLIENT_TOKEN_LIFETIME_MINUTES`,
            60 minutes = 3600 by default). There is no refresh token: request a new
            one with the same credentials.'
      required:
      - access
      - expires_in
    ApiClientTokenRequestRequest:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
          description: The API client's id, as shown once when the client was created.
        client_secret:
          type: string
          writeOnly: true
          minLength: 1
          description: The API client's secret. Keep it on your server — never ship
            it in a browser or mobile app.
      required:
      - client_id
      - client_secret
    CancelledByEnum:
      enum:
      - company
      - driver
      - system
      type: string
      description: |-
        * `company` - Company
        * `driver` - Driver
        * `system` - System
    Driver:
      type: object
      description: |-
        Admin CRUD for the basic profile — verification statuses are managed
        exclusively through the KYC endpoints, not this serializer. The KYC
        fields below are read-only projections of the related DriverKyc row
        (see Driver.kyc) — kept here, flattened, so this endpoint's response
        shape doesn't change just because KYC moved to its own table.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The driver's id (UUID).
        full_name:
          type: string
          maxLength: 150
          description: The driver's full name. Required when you create a driver;
            up to 150 characters.
        phone_number:
          type: string
          maxLength: 20
          description: The driver's mobile number in international format (`+919777700001`;
            10-15 digits, `+` optional). Required. This is what they sign in with,
            so it must be unique in your company.
        emergency_contact_name:
          type: string
          maxLength: 150
          description: Who to call if the driver needs help. **Required** when you
            create a driver (up to 150 characters).
        emergency_contact_phone:
          type: string
          maxLength: 20
          description: That person's number (up to 20 characters). **Required** when
            you create a driver.
        email:
          type: string
          format: email
          readOnly: true
          description: The driver's email, if they gave one in the app. Read-only.
        date_of_birth:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Date of birth (`YYYY-MM-DD`), as entered by the driver. Read-only
            here.
        city:
          type: string
          readOnly: true
          description: The driver's city, as entered by the driver. Read-only here.
        profile_photo_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: URL of the driver's selfie, or `null`.
        onboarding_status:
          type: string
          readOnly: true
          description: 'Where the driver is in joining: `profile_incomplete`, `documents_required`,
            `under_review` (waiting for you), `action_required` (something was rejected)
            or `approved`. Derived from their profile and KYC; read-only.'
        aadhar_status:
          type: string
          readOnly: true
          description: 'Aadhaar verification: `pending`, `verified` or `rejected`.'
        dl_status:
          type: string
          readOnly: true
          description: 'Driving-licence verification: `pending`, `verified` or `rejected`.'
        police_status:
          type: string
          readOnly: true
          description: 'Police-verification status: `pending`, `verified` or `rejected`.'
        dl_expiry_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: The verified licence's expiry date, or `null`.
        dl_allowed_categories:
          readOnly: true
          description: Vehicle categories the verified licence covers (`two_wheeler`,
            `three_wheeler`, `four_wheeler`) - decides which vehicles the driver may
            take.
        account_status:
          allOf:
          - $ref: '#/components/schemas/DriverAccountStatusEnum'
          readOnly: true
          description: '`active`, `locked_dl_expired` (licence lapsed) or `disabled`.
            Only `active` drivers can sign in and get trips.'
        current_vehicle_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The vehicle the driver is on duty with, or `null` when off
            duty.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601, UTC).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601, UTC).
      required:
      - aadhar_status
      - account_status
      - city
      - created_at
      - current_vehicle_id
      - date_of_birth
      - dl_allowed_categories
      - dl_expiry_date
      - dl_status
      - email
      - emergency_contact_name
      - emergency_contact_phone
      - full_name
      - id
      - onboarding_status
      - phone_number
      - police_status
      - profile_photo_url
      - updated_at
    DriverAadharSubmitRequest:
      type: object
      properties:
        number:
          type: string
          minLength: 1
          description: The 12-digit Aadhaar number (spaces are ignored). Required.
            Only its last four digits are kept.
        front:
          type: string
          format: binary
          description: Image of the front of the card (`jpg`, `jpeg`, `png`, `webp`,
            up to 10 MB). Required.
        back:
          type: string
          format: binary
          description: Image of the back of the card. Required.
      required:
      - back
      - front
      - number
    DriverAccountStatusEnum:
      enum:
      - active
      - locked_dl_expired
      - disabled
      type: string
      description: |-
        * `active` - Active
        * `locked_dl_expired` - Locked — DL Expired
        * `disabled` - Disabled
    DriverAvailableVehicle:
      type: object
