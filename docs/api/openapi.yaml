      tags:
      - Driver duty & location
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverDutyOnRequest'
            examples:
              WithTheFirstGpsFix:
                value:
                  vehicle_id: 34dbaab9-e77f-466a-93f3-3637131968ea
                  lat: '12.971600'
                  lng: '77.594600'
                summary: With the first GPS fix
              WithoutALocation:
                value:
                  vehicle_id: 34dbaab9-e77f-466a-93f3-3637131968ea
                summary: Without a location
        required: true
      security:
      - DriverToken: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID:
