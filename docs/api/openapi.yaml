        * `bonus` - Bonus
        * `penalty` - Penalty
        * `payout` - Payout
        * `adjustment` - Adjustment
    WebhookResult:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/WebhookResultStatusEnum'
          description: |-
            What the server did with the event - for your logs; every value is a `200` so Razorpay does not retry.

            - `paid` - the trip is now paid and the customer was texted their delivery OTP.
            - `already_paid` - the trip had already been marked paid (a repeat delivery); nothing changed.
            - `underpaid` - the payment was less than the fare; the trip stays unpaid.
            - `trip_not_in_progress` - money arrived for a trip that is no longer on the road (e.g. cancelled); nothing was marked paid and it **needs a manual refund**.
            - `unknown_qr` - no trip has this QR code.
            - `ignored` - an event type this API doesn't act on.

            * `paid` - paid
            * `already_paid` - already_paid
            * `underpaid` - underpaid
            * `trip_not_in_progress` - trip_not_in_progress
            * `unknown_qr` - unknown_qr
            * `ignored` - ignored
      required:
      - status
    WebhookResultStatusEnum:
