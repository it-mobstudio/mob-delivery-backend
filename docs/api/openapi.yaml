          format: uuid
          readOnly: true
          description: The driver's id (UUID).
        full_name:
          type: string
          maxLength: 150
          description: The driver's name; empty until they give it in onboarding.
        phone_number:
          type: string
          maxLength: 20
          description: The number they sign in with.
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
          description: Email, or empty.
        date_of_birth:
          type: string
          format: date
          nullable: true
          description: Date of birth (`YYYY-MM-DD`), or `null` until given.
        address_line:
          type: string
          maxLength: 255
          description: Street address, or empty.
        city:
          type: string
          maxLength: 100
          description: City, or empty.
        pincode:
          type: string
          maxLength: 10
          description: 6-digit postal code, or empty.
        profile_photo_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: URL of the driver's selfie, or `null`.
        emergency_contact_name:
          type: string
          maxLength: 150
          description: Who to call if the driver needs help, or empty.
        emergency_contact_phone:
          type: string
          maxLength: 20
          description: That person's number, or empty.
        account_status:
          allOf:
          - $ref: '#/components/schemas/DriverAccountStatusEnum'
          description: '`active`, `locked_dl_expired` (licence lapsed) or `disabled`.'
        is_profile_complete:
          type: boolean
          readOnly: true
          description: '`true` once name, date of birth and an emergency contact are
            all set.'
        onboarding_status:
          type: string
          readOnly: true
          description: 'Where the driver is in joining: `profile_incomplete`, `documents_required`,
            `under_review`, `action_required` or `approved`. **Key the app''s first
            screen on this.**'
        aadhar_status:
          type: string
          readOnly: true
          description: 'Aadhaar verification: `pending`, `verified` or `rejected`.
            (Also inside `kyc`.)'
        dl_status:
          type: string
          readOnly: true
          description: 'Driving-licence verification: `pending`, `verified` or `rejected`.'
        police_status:
          type: string
          readOnly: true
          description: 'Police-verification status: `pending`, `verified` or `rejected`.'
        dl_expiry_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Licence expiry (`YYYY-MM-DD`), or `null`.
        dl_allowed_categories:
          readOnly: true
          description: Vehicle categories the verified licence covers - which vehicles
            the driver may take.
        aadhar_rejection_note:
          type: string
          readOnly: true
          nullable: true
          description: Why the company rejected the Aadhaar (empty unless rejected).
        dl_rejection_note:
          type: string
          readOnly: true
          nullable: true
          description: Why the company rejected the licence (empty unless rejected).
        police_rejection_note:
          type: string
          readOnly: true
          nullable: true
          description: Why the company rejected the police certificate (empty unless
            rejected).
        is_eligible_for_assignment:
          type: boolean
          readOnly: true
          description: '`true` when the driver can receive trips (all three documents
            verified, licence unexpired, account active).'
        kyc:
          allOf:
          - $ref: '#/components/schemas/DriverKycSummary'
          readOnly: true
          description: What the driver has submitted for each document, so the app
            can show it back to them and what to fix.
        payout:
          allOf:
          - $ref: '#/components/schemas/DriverPayoutSummary'
          readOnly: true
          description: Where the driver's payouts go (account number masked).
        current_vehicle_id:
          type: string
          format: uuid
          nullable: true
          description: The vehicle the driver is on duty with, or `null` when off
            duty.
        current_vehicle:
          allOf:
          - $ref: '#/components/schemas/DriverVehicleSummary'
          nullable: true
          readOnly: true
          description: That vehicle in full, or `null`.
        is_online:
          type: boolean
          description: '`true` while the driver is on duty and can be matched to trips.'
      required:
      - aadhar_rejection_note
      - aadhar_status
      - current_vehicle
      - dl_allowed_categories
      - dl_expiry_date
      - dl_rejection_note
      - dl_status
      - emergency_contact_name
      - emergency_contact_phone
      - id
      - is_eligible_for_assignment
      - is_profile_complete
      - kyc
      - onboarding_status
      - payout
      - phone_number
      - police_rejection_note
      - police_status
      - profile_photo_url
    DriverOtpRequestRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          description: The driver's mobile number in international format (`+919000000001`;
            10-15 digits, `+` optional). Required. Send it exactly as the company
            registered it.
      required:
      - phone_number
    DriverOtpRequestResult:
      type: object
      properties:
        message:
          type: string
          description: Confirmation that an SMS was sent to the number.
        otp:
          type: string
          description: The six-digit code itself. **Only present on non-production
            servers** (`DRIVER_OTP_DEBUG_RESPONSE=True`) so login can be tested without
            an SMS gateway. A production server never returns it.
      required:
      - message
    DriverOtpVerifyRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          description: The same number the code was sent to. Required.
        otp:
          type: string
          minLength: 1
          description: The 6-digit code from the SMS (valid 5 minutes, single use).
            Required.
      required:
      - otp
      - phone_number
    DriverPayoutSummary:
      type: object
      properties:
        upi_id:
          type: string
          nullable: true
          description: UPI id payouts are sent to.
        bank_account_holder:
          type: string
          nullable: true
          description: Name on the bank account.
        bank_account_last4:
          type: string
          nullable: true
          description: Last four digits of the account number. The full number is
            never returned.
        bank_ifsc:
          type: string
          nullable: true
          description: Bank branch IFSC code.
        is_set:
          type: boolean
          description: A UPI id or a bank account is on file.
      required:
      - bank_account_holder
      - bank_account_last4
      - bank_ifsc
      - is_set
      - upi_id
    DriverPhotoRequest:
      type: object
      properties:
        photo:
          type: string
          format: binary
          description: A clear picture of the driver's face (`jpg`, `jpeg`, `png`,
            `webp`, up to 10 MB). Required.
      required:
      - photo
    DriverPoliceSubmitRequest:
      type: object
      properties:
        document:
          type: string
          format: binary
          description: 'The police-verification certificate: an image (`jpg`, `jpeg`,
            `png`, `webp`) or a PDF, up to 10 MB. Required.'
      required:
      - document
    DriverRequest:
      type: object
      description: |-
        Admin CRUD for the basic profile — verification statuses are managed
        exclusively through the KYC endpoints, not this serializer. The KYC
        fields below are read-only projections of the related DriverKyc row
        (see Driver.kyc) — kept here, flattened, so this endpoint's response
        shape doesn't change just because KYC moved to its own table.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
          description: The driver's full name. Required when you create a driver;
            up to 150 characters.
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
          description: The driver's mobile number in international format (`+919777700001`;
            10-15 digits, `+` optional). Required. This is what they sign in with,
            so it must be unique in your company.
        emergency_contact_name:
          type: string
          minLength: 1
          maxLength: 150
          description: Who to call if the driver needs help. **Required** when you
            create a driver (up to 150 characters).
        emergency_contact_phone:
          type: string
          minLength: 1
          maxLength: 20
          description: That person's number (up to 20 characters). **Required** when
            you create a driver.
      required:
      - emergency_contact_name
      - emergency_contact_phone
      - full_name
      - phone_number
    DriverSession:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT (60 minutes by default). Send it as `Authorization:
            Bearer <accessToken>`.'
        tokenType:
          type: string
          description: Always `Bearer`.
        expiresInSeconds:
          type: integer
          description: Lifetime of `accessToken` in seconds.
        refreshToken:
          type: string
          description: Long-lived JWT (30 days by default). Trade it at `POST /driver/auth/refresh`
            for a new pair.
        refreshExpiresInSeconds:
          type: integer
          description: Lifetime of `refreshToken` in seconds.
        driverName:
          type: string
          description: The driver's full name (empty for a driver who hasn't given
            it yet).
        driver:
          allOf:
          - $ref: '#/components/schemas/DriverMe'
          description: The driver's profile — the same object `GET /driver/me` returns.
      required:
      - accessToken
      - driver
      - driverName
      - expiresInSeconds
      - refreshExpiresInSeconds
      - refreshToken
      - tokenType
    DriverStats:
      type: object
      properties:
        today:
          allOf:
          - $ref: '#/components/schemas/StatsPeriod'
          description: From the driver's local midnight (per `utc_offset_minutes`)
            until now.
        all_time:
          allOf:
          - $ref: '#/components/schemas/StatsPeriod'
          description: Everything since the driver joined.
      required:
      - all_time
      - today
    DriverTokenRefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: The `refreshToken` from sign-in (or the last refresh). Required.
      required:
      - refreshToken
    DriverTrip:
      type: object
      description: |-
        The full trip as the assigned driver sees it — adds what the trip pays
        them, which the company-facing TripSerializer deliberately leaves out.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The trip's id (UUID). Use it in every `/trips/{id}` call.
        status:
          allOf:
          - $ref: '#/components/schemas/TripStatusEnum'
          readOnly: true
          description: 'Where the trip is in its lifecycle: `requested`, `no_driver_available`,
            `assigned`, `arrived_at_pickup`, `in_progress`, `completed` or `cancelled`.
            See the Trip lifecycle guide.'
        reference_id:
          type: string
          readOnly: true
          description: Your own order number, exactly as you sent it (empty string
            if you sent none).
        vehicle_type:
          allOf:
          - $ref: '#/components/schemas/VehicleTypeSummary'
          readOnly: true
          description: The kind of vehicle booked.
        driver:
          allOf:
          - $ref: '#/components/schemas/TripDriverSummary'
          readOnly: true
          description: The assigned driver, or `null` until one is assigned (and after
            a `no_driver_available`).
        vehicle:
          allOf:
          - $ref: '#/components/schemas/TripVehicleSummary'
          readOnly: true
          description: The vehicle the driver is on, or `null` until a driver is assigned.
        pickup_address:
          type: string
          readOnly: true
          description: Pickup address, as sent.
        pickup_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          description: Pickup latitude, decimal string with 6 decimals.
        pickup_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          description: Pickup longitude, decimal string with 6 decimals.
        pickup_contact_name:
          type: string
          readOnly: true
          description: Contact at the pickup, or empty.
        pickup_contact_phone:
          type: string
          readOnly: true
          description: Phone of that contact, or empty.
        drop_address:
          type: string
          readOnly: true
          description: Drop address, as sent.
        drop_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          description: Drop latitude, decimal string with 6 decimals.
        drop_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          description: Drop longitude, decimal string with 6 decimals.
        drop_contact_name:
          type: string
          readOnly: true
          description: Contact at the drop, or empty.
        drop_contact_phone:
          type: string
          readOnly: true
          description: Phone of that contact - the delivery OTP goes here on cash-on-delivery
            trips.
        distance_meters:
          type: integer
          readOnly: true
          nullable: true
          description: Route length in metres, calculated when the trip was booked.
        duration_seconds:
          type: integer
          readOnly: true
          nullable: true
          description: Estimated driving time in seconds, calculated when the trip
            was booked.
        route_polyline:
          type: string
          readOnly: true
          description: The route as an encoded polyline. Decode it at `polyline_precision`
            (6 decimal places - not Google's 5) to draw the route on a map.
        polyline_precision:
          type: integer
          readOnly: true
          description: Decimal places `route_polyline` is encoded at. Always 6.
        base_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Flat starting fare, decimal string (e.g. `30.00`).
        distance_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Charge for the route's distance, decimal string.
        time_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Charge for the estimated driving time, decimal string.
        surge_multiplier:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          description: Demand multiplier applied to base + distance + time (currently
            always `1.00`).
        total_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: 'What the delivery costs: (base + distance + time) x surge,
            never below the vehicle type''s minimum fare. Decimal string. Fixed at
            booking - it does not change later.'
        currency:
          type: string
          readOnly: true
          description: ISO 4217 currency code. Always `INR`.
        payment_mode:
          allOf:
          - $ref: '#/components/schemas/PaymentModeEnum'
          readOnly: true
          description: '`prepaid` or `cod`, as sent.'
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
          description: '`pending` or `paid`. Prepaid trips are `paid` from the start;
            cash-on-delivery trips become `paid` once the customer''s Razorpay payment
            is confirmed.'
        cod_collected_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the cash-on-delivery payment was confirmed (ISO 8601,
            UTC), or `null`.
        payment_reference:
          type: string
          readOnly: true
          description: Razorpay's id for the payment that settled a cash-on-delivery
            trip (`pay_...`) - for reconciling against your Razorpay dashboard. Empty
            until paid.
        invoice_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Absolute URL of the invoice you supplied, or `null`.
        invoice_number:
          type: string
          readOnly: true
          description: The invoice number you supplied, or empty.
        verify_items:
          type: boolean
          readOnly: true
          description: Whether the driver must confirm every item before payment/completion.
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripItem'
          readOnly: true
          description: The goods, in the order you sent them, with the driver's per-item
            answers.
        cancellation_reason:
          type: string
          readOnly: true
          description: Why the trip was cancelled (empty unless `status` is `cancelled`).
        cancelled_by:
          oneOf:
          - $ref: '#/components/schemas/CancelledByEnum'
          - $ref: '#/components/schemas/BlankEnum'
          description: 'Who cancelled: `company`, `driver` or `system`; empty unless
            cancelled.'
          readOnly: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When a driver was assigned (ISO 8601, UTC), or `null`.
        arrived_at_pickup_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the driver reported arriving at the pickup, or `null`.
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the driver picked up the goods and started the delivery,
            or `null`.
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the delivery was completed, or `null`.
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the trip was cancelled, or `null`.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was created (ISO 8601, UTC).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When the record was last changed (ISO 8601, UTC).
        driver_earning:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: What this trip pays the assigned driver (decimal string; the
            driver's share of `total_fare`), or `null` until the trip is completed.
            Only visible to the driver, never to the company API.
      required:
      - arrived_at_pickup_at
      - assigned_at
      - base_fare
      - cancellation_reason
      - cancelled_at
      - cancelled_by
      - cod_collected_at
      - completed_at
      - created_at
      - currency
      - distance_fare
      - distance_meters
      - driver
      - driver_earning
      - drop_address
      - drop_contact_name
      - drop_contact_phone
      - drop_lat
      - drop_lng
      - duration_seconds
      - id
      - invoice_number
      - invoice_url
      - items
      - payment_mode
      - payment_reference
      - payment_status
      - pickup_address
      - pickup_contact_name
      - pickup_contact_phone
      - pickup_lat
      - pickup_lng
      - polyline_precision
      - reference_id
      - route_polyline
      - started_at
      - status
      - surge_multiplier
      - time_fare
      - total_fare
      - updated_at
      - vehicle
      - vehicle_type
      - verify_items
